<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>J.A.R.V.I.S.</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="icon.png" type="image/png">
<style>
:root{
  --txt:#ececee; --dim:rgba(255,255,255,.52); --faint:rgba(255,255,255,.3); --ghost:rgba(255,255,255,.12);
  --glass:rgba(16,16,18,.64); --glass2:rgba(26,26,29,.72); --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --warm:#f3c896; --orange:#ff8a3d; --green:#36d97b; --blue:#4d8dff; --purple:#a35cff; --red:#ff5a5f;
  --font:"Segoe UI Variable Text","Segoe UI",-apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif;
  --ease:cubic-bezier(.2,.7,.1,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:var(--txt);font-family:var(--font);overflow:hidden;user-select:none;-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#fx{pointer-events:none}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font-family:inherit;color:var(--txt);background:none;border:0;outline:0;user-select:text}
::selection{background:rgba(243,200,150,.35)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:8px}::-webkit-scrollbar-track{background:transparent}

.ui{position:fixed;z-index:5;transition:opacity .6s var(--ease),transform .6s var(--ease)}
.boot .ui{opacity:0}
.pill{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 14px;border-radius:999px;background:rgba(20,20,22,.55);border:1px solid var(--line2);
  font-size:11.5px;color:rgba(255,255,255,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:all .25s var(--ease);white-space:nowrap}
.pill:hover{background:rgba(40,40,44,.7);color:#fff;border-color:rgba(255,255,255,.22)}
.pill.on{background:rgba(255,255,255,.1);color:#fff}
.pill svg{width:13px;height:13px;opacity:.85}

/* top */
#brand{top:20px;left:22px}
#brand b{display:block;font-size:12.5px;font-weight:600;letter-spacing:.02em}
#brand span{display:block;font-size:10.5px;color:var(--faint);margin-top:3px}
#topnav{top:18px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
#topright{top:18px;right:20px;display:flex;gap:8px}
#back{top:18px;left:22px;opacity:0;pointer-events:none;transform:translateX(-8px)}
.focused #back{opacity:1;pointer-events:auto;transform:none}
.focused #brand{opacity:0;pointer-events:none}

/* greeting */
#shade{inset:0 auto 0 0;width:min(460px,40vw);background:linear-gradient(90deg,rgba(0,0,0,.62),rgba(0,0,0,.35) 55%,transparent);pointer-events:none;z-index:4}
.focused #shade,.modal-open #shade{opacity:0}
#gl{cursor:crosshair}
#greet{top:74px;left:24px;width:300px}
.focused #greet,.modal-open #greet{opacity:0;pointer-events:none;transform:translateX(-10px)}
#greet h1{font-size:25px;font-weight:500;letter-spacing:-.01em;line-height:1.15}
#greet .since{font-size:10.5px;color:var(--faint);margin-top:6px}
#greet .news{font-size:12px;color:rgba(255,255,255,.72);margin-top:16px;line-height:1.5}
#greet .lbl{font-size:9.5px;letter-spacing:.14em;color:var(--faint);margin:22px 0 9px;font-weight:600}
#greet .row{display:grid;grid-template-columns:62px 1fr;gap:8px;font-size:11.5px;line-height:1.45;margin-bottom:7px;color:rgba(255,255,255,.72)}
#greet .row .d{color:var(--orange)}
#greet .row.none{color:var(--faint);display:block}
#greet .sys{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;line-height:1.7}
#greet .sys i{font-style:normal;color:rgba(255,255,255,.82)}
#greet .keyhint{margin-top:18px;font-size:11px;color:var(--warm);opacity:.85;cursor:pointer;line-height:1.5}
#greet .keyhint:hover{opacity:1;text-decoration:underline}

/* labels on the galaxy */
#labels{position:fixed;inset:0;z-index:3;pointer-events:none}
.lab{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;transform:translate(-50%,-50%);text-align:center;transition:opacity .5s}
.lab b{display:block;font-size:11.5px;font-weight:600;color:rgba(255,255,255,.9);text-shadow:0 0 12px #000,0 0 4px #000;letter-spacing:.01em}
.lab span{display:block;font-size:9.5px;color:rgba(255,255,255,.38);margin-top:2px;text-shadow:0 0 8px #000}
.lab:hover b{color:#fff;text-shadow:0 0 14px rgba(255,220,180,.6),0 0 4px #000}
.lab::before{content:"";position:absolute;left:-9px;top:6px;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 6px #fff;opacity:.7}
#status{position:fixed;z-index:4;left:0;top:0;transform:translate(-50%,0);transition:opacity .4s}
#status .pill{height:24px;font-size:10.5px;padding:0 11px}
#status .dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
#status[data-s="listening"] .dot{background:var(--blue);box-shadow:0 0 10px var(--blue);animation:pulse 1s infinite}
#status[data-s="thinking"] .dot{background:var(--warm);box-shadow:0 0 10px var(--warm);animation:pulse .6s infinite}
#status[data-s="speaking"] .dot{background:#fff;box-shadow:0 0 10px #fff;animation:pulse .35s infinite}
#status[data-s="offline"] .dot{background:var(--orange);box-shadow:0 0 8px var(--orange)}
@keyframes pulse{50%{transform:scale(1.6);opacity:.55}}

/* command bar */
#dock{left:50%;bottom:54px;transform:translateX(-50%);width:min(600px,calc(100vw - 40px));display:flex;flex-direction:column;align-items:center}
#sub{width:100%;text-align:center;margin-bottom:14px;min-height:20px;pointer-events:none}
#sub .you{font-size:11.5px;color:var(--faint);margin-bottom:6px;transition:opacity .5s}
#sub .say{font-size:15.5px;line-height:1.5;color:rgba(255,255,255,.92);text-shadow:0 0 18px #000,0 0 6px #000;transition:opacity .8s}
#sub .acts{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
#sub .act{font-size:10px;color:rgba(255,255,255,.6);border:1px solid var(--line2);border-radius:999px;padding:3px 9px;background:rgba(20,20,22,.6)}
#bar{width:100%;height:48px;display:flex;align-items:center;gap:6px;padding:0 7px 0 7px;border-radius:999px;background:rgba(18,18,20,.66);border:1px solid var(--line2);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 10px 40px rgba(0,0,0,.5);transition:border-color .3s,box-shadow .3s}
#bar:focus-within{border-color:rgba(255,255,255,.24);box-shadow:0 10px 50px rgba(0,0,0,.6),0 0 0 4px rgba(255,255,255,.03)}
#bar input{flex:1;height:100%;font-size:13.5px;padding:0 6px}
#bar input::placeholder{color:rgba(255,255,255,.32)}
.ib{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:rgba(255,255,255,.7);transition:all .2s}
.ib:hover{background:rgba(255,255,255,.08);color:#fff}
.ib svg{width:16px;height:16px}
#mic.on{background:rgba(77,141,255,.18);color:#9fc0ff;box-shadow:0 0 0 1px rgba(77,141,255,.4),0 0 20px rgba(77,141,255,.35)}
#send{background:rgba(255,255,255,.9);color:#000}
#send:hover{background:#fff;color:#000}
kbd{font-family:inherit;font-size:9.5px;color:var(--faint);border:1px solid var(--line2);border-radius:5px;padding:1px 5px;margin-right:6px}

#tools{left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:2px;padding:3px;border-radius:999px;background:rgba(16,16,18,.45);border:1px solid var(--line)}
#tools .ib{width:26px;height:26px;color:rgba(255,255,255,.4)}
#tools .ib svg{width:12px;height:12px}
#tools .ib:hover{color:#fff}

/* side panel */
#side{top:66px;right:20px;bottom:118px;width:min(410px,calc(100vw - 40px));border-radius:16px;background:var(--glass);border:1px solid var(--line);
  backdrop-filter:blur(22px) saturate(1.2);-webkit-backdrop-filter:blur(22px);display:flex;flex-direction:column;opacity:0;transform:translateX(24px);pointer-events:none;overflow:hidden}
.focused #side{opacity:1;transform:none;pointer-events:auto}
#side header{padding:18px 20px 12px;display:flex;align-items:baseline;gap:10px}
#side header h2{font-size:18px;font-weight:500}
#side header small{font-size:10.5px;color:var(--faint)}
#side .body{flex:1;overflow:auto;padding:4px 14px 16px}
.field{display:flex;align-items:center;gap:8px;height:38px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--line);padding:0 12px;margin:0 6px 12px}
.field:focus-within{border-color:var(--line2)}
.field input{flex:1;font-size:12.5px;height:100%}
.field svg{width:13px;height:13px;opacity:.5}
.item{padding:11px 12px;border-radius:10px;margin:2px 0;transition:background .2s;position:relative}
.item:hover{background:rgba(255,255,255,.045)}
.item .t{font-size:12.5px;line-height:1.45;color:rgba(255,255,255,.88);word-wrap:break-word;padding-right:20px;user-select:text}
.item .m{font-size:10px;color:var(--faint);margin-top:4px}
.item .m .o{color:var(--orange)}
.item .x{position:absolute;right:8px;top:9px;width:22px;height:22px;border-radius:6px;color:var(--faint);opacity:0;font-size:14px}
.item:hover .x{opacity:1}.item .x:hover{background:rgba(255,90,95,.15);color:var(--red)}
.item.done{opacity:.4}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 6px 12px}
.chip{font-size:10.5px;padding:5px 10px;border-radius:999px;border:1px solid var(--line2);color:rgba(255,255,255,.7);transition:all .2s}
.chip:hover{background:rgba(255,255,255,.08);color:#fff}
.btn{height:34px;padding:0 14px;border-radius:9px;background:rgba(255,255,255,.08);border:1px solid var(--line2);font-size:12px;color:rgba(255,255,255,.85);transition:all .2s}
.btn:hover{background:rgba(255,255,255,.14);color:#fff}
.btn.pri{background:rgba(255,255,255,.92);color:#000;border-color:transparent}
.btn.pri:hover{background:#fff}
.btn.danger:hover{background:rgba(255,90,95,.18);color:#ffb3b5;border-color:rgba(255,90,95,.35)}
.appgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px;padding:0 6px}
.app{display:flex;align-items:center;gap:9px;padding:9px;border-radius:10px;border:1px solid transparent;text-align:left;font-size:11.5px;color:rgba(255,255,255,.82);transition:all .2s;min-width:0}
.app:hover{background:rgba(255,255,255,.06);border-color:var(--line)}
.app i{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:600;color:#fff}
.app span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg{margin:8px 6px;max-width:88%;padding:9px 12px;border-radius:12px;font-size:12.5px;line-height:1.5;user-select:text}
.msg.u{margin-left:auto;background:rgba(255,255,255,.09);border-bottom-right-radius:4px}
.msg.j{background:rgba(243,200,150,.07);border:1px solid rgba(243,200,150,.12);border-bottom-left-radius:4px;color:rgba(255,255,255,.88)}
.msg small{display:block;font-size:9.5px;color:var(--faint);margin-top:4px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 6px}
.tile{border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.025);padding:12px;position:relative;overflow:hidden}
.tile .k{font-size:10px;color:var(--faint);letter-spacing:.06em}
.tile .v{font-size:22px;font-weight:500;margin-top:4px;font-variant-numeric:tabular-nums}
.tile .v small{font-size:11px;color:var(--dim);margin-left:2px}
.tile canvas{position:static;width:100%;height:30px;margin-top:6px}
.sect{font-size:9.5px;letter-spacing:.14em;color:var(--faint);margin:18px 12px 8px;font-weight:600}
.btnrow{display:flex;flex-wrap:wrap;gap:6px;padding:0 6px}
.cmd{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:10px;font-size:12.5px;color:rgba(255,255,255,.85)}
.cmd:hover{background:rgba(255,255,255,.05)}
.cmd small{display:block;font-size:10px;color:var(--faint);margin-top:2px}
.empty{font-size:12px;color:var(--faint);padding:20px 12px;text-align:center;line-height:1.6}

/* modals */
#veil{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .4s}
.modal-open #veil{opacity:1;pointer-events:auto}
.modal{position:fixed;z-index:21;left:50%;top:50%;transform:translate(-50%,-48%) scale(.985);opacity:0;pointer-events:none;
  background:rgba(14,14,16,.78);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(26px) saturate(1.25);-webkit-backdrop-filter:blur(26px);
  box-shadow:0 30px 120px rgba(0,0,0,.7);transition:all .45s var(--ease);max-height:calc(100vh - 110px);display:flex;flex-direction:column}
.modal.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.mhead{display:flex;align-items:center;gap:10px;padding:18px 20px 12px}
.mhead h3{font-size:19px;font-weight:500}
.mhead .date{font-size:10px;color:var(--dim);border:1px solid var(--line2);padding:3px 8px;border-radius:999px}
.mhead .close{margin-left:auto;width:26px;height:26px;border-radius:50%;color:var(--faint);font-size:15px}
.mhead .close:hover{background:rgba(255,255,255,.08);color:#fff}
.mbody{overflow:auto;padding:0 20px 20px}
.search{display:flex;align-items:center;gap:10px;height:42px;border-radius:11px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.03);padding:0 14px}
.search input{flex:1;height:100%;font-size:13px}
.search svg{width:14px;height:14px;opacity:.5}
#dash{width:min(980px,calc(100vw - 40px))}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.card{border-radius:13px;background:rgba(255,255,255,.025);border:1px solid var(--line);padding:14px 14px 10px;position:relative;overflow:hidden;cursor:pointer;transition:background .2s}
.card:hover{background:rgba(255,255,255,.045)}
.card::before{content:"";position:absolute;inset:0;border-radius:13px;padding:1px;background:linear-gradient(180deg,var(--c),transparent 70%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.75;pointer-events:none}
.card .n{font-size:27px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.card .l{font-size:11px;color:rgba(255,255,255,.7);margin-top:2px}
.card .s{font-size:9.5px;color:var(--faint);margin-top:2px}
.card .badge{position:absolute;top:13px;right:12px;font-size:9px;padding:2px 7px;border-radius:5px;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
.card canvas{position:static;width:100%;height:36px;margin-top:8px}
.panels{display:grid;grid-template-columns:1.05fr 1fr 1fr;gap:10px;margin-top:10px}
.panel{border-radius:13px;background:rgba(255,255,255,.025);border:1px solid var(--line);padding:14px;min-height:190px}
.panel h4{font-size:12px;font-weight:600;display:flex;align-items:center;gap:7px}
.panel h4::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.panel .hs{font-size:9.5px;color:var(--faint);margin:3px 0 12px 14px}
.panel canvas{position:static;width:100%;height:125px}
.hbar{display:block;width:100%;text-align:left;margin-bottom:9px;cursor:pointer}
.hbar .r{display:flex;justify-content:space-between;font-size:10.5px;color:rgba(255,255,255,.78);margin-bottom:4px}
.hbar .r em{font-style:normal;color:var(--faint);font-variant-numeric:tabular-nums}
.hbar .tr{height:3px;border-radius:3px;background:rgba(255,255,255,.06);overflow:hidden}
.hbar .tr div{height:100%;border-radius:3px;background:var(--c);width:0;transition:width 1s var(--ease)}
.hbar:hover .r{color:#fff}
.lists{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.list{border-radius:13px;background:rgba(255,255,255,.025);border:1px solid var(--line);padding:14px 14px 6px}
.list h5{font-size:9.5px;letter-spacing:.14em;color:var(--faint);font-weight:600;margin-bottom:10px}
.li{padding:7px 0;border-top:1px solid rgba(255,255,255,.04)}
.li:first-of-type{border-top:0}
.li .a{font-size:11.5px;color:rgba(255,255,255,.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .b{font-size:9.5px;color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#find{width:min(820px,calc(100vw - 40px));height:min(560px,calc(100vh - 110px))}
#find .mbody{flex:1}
.res{padding:11px 12px;border-radius:10px;cursor:pointer;margin:2px 0}
.res.sel,.res:hover{background:rgba(255,255,255,.055)}
.res .a{font-size:12.5px;color:#fff}
.res .g{font-size:9.5px;color:var(--faint);margin:2px 0 4px}
.res .b{font-size:11px;color:rgba(255,255,255,.6);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.res mark{background:rgba(243,200,150,.25);color:#fff;border-radius:3px}
#settings{width:min(520px,calc(100vw - 40px))}
.form{display:grid;gap:14px}
.form label{display:block;font-size:10.5px;color:var(--dim);margin-bottom:6px;letter-spacing:.03em}
.form .inp{width:100%;height:38px;border-radius:10px;border:1px solid var(--line2);background:rgba(255,255,255,.04);padding:0 12px;font-size:12.5px}
.form .inp:focus{border-color:rgba(255,255,255,.3)}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .hint{font-size:10px;color:var(--faint);margin-top:5px;line-height:1.5}
.form .hint a{color:var(--warm)}
select.inp{appearance:none;color:var(--txt);font-family:inherit}
select.inp option{background:#151517}
.tog{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.tog div b{display:block;font-size:12.5px;font-weight:500}
.tog div span{display:block;font-size:10.5px;color:var(--faint);margin-top:2px}
.sw{flex:none;width:34px;height:20px;border-radius:20px;background:rgba(255,255,255,.12);position:relative;transition:background .25s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .25s var(--ease)}
.tog.on .sw{background:var(--green)}.tog.on .sw::after{transform:translateX(14px)}
#confirm{width:min(460px,calc(100vw - 40px))}
#confirm pre{font-family:Consolas,monospace;font-size:12px;background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:10px;padding:12px;white-space:pre-wrap;word-break:break-all;margin:6px 0 16px;user-select:text}
#toast{top:62px;left:50%;transform:translate(-50%,-12px);opacity:0;pointer-events:none;z-index:30}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast .pill{height:38px;font-size:12.5px;padding:0 18px;background:rgba(30,24,18,.8);border-color:rgba(243,200,150,.35);color:#fff;box-shadow:0 0 40px rgba(243,200,150,.15)}

/* ---------- v3: left rail ---------- */
#brand{left:78px}
#back{left:78px}
#greet{left:80px}
#shade{width:min(520px,44vw)}
#rail{left:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:3px;padding:6px;border-radius:18px;
  background:rgba(14,14,16,.55);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);z-index:8}
#rail .sep{height:1px;margin:5px 8px;background:var(--line)}
.rb{position:relative;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:rgba(255,255,255,.5);transition:all .25s var(--ease)}
.rb svg{width:17px;height:17px}
.rb:hover{color:#fff;background:rgba(255,255,255,.07)}
.rb.on{color:#fff;background:rgba(255,255,255,.11);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.rb.on::before{content:"";position:absolute;left:-6px;top:11px;bottom:11px;width:2px;border-radius:2px;background:var(--warm);box-shadow:0 0 8px var(--warm)}
.rb::after{display:none}
.rb:hover::after{opacity:1;transform:translate(0,-50%)}
.rb .badge{position:absolute;top:5px;right:5px;min-width:14px;height:14px;padding:0 3px;border-radius:7px;background:var(--orange);color:#000;font-size:8.5px;font-weight:700;display:grid;place-items:center}
.rb .live{position:absolute;bottom:6px;right:7px;width:5px;height:5px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green)}

/* ---------- v3: nav chips (timer / music) ---------- */
#topnav .chipnav{font-variant-numeric:tabular-nums}
#topnav .chipnav b{font-weight:600;color:#fff}
#topnav .chipnav i{font-style:normal;color:var(--dim);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- greet extras ---------- */
#greet .wx{display:flex;align-items:baseline;gap:8px;margin-top:4px;font-size:12px;color:rgba(255,255,255,.72);cursor:pointer}
#greet .wx b{font-size:20px;font-weight:500;color:#fff}
#greet .np{font-size:11.5px;color:rgba(255,255,255,.72);cursor:pointer;display:flex;gap:8px;align-items:center}
#greet .np .eq{display:inline-flex;gap:2px;align-items:flex-end;height:10px}
#greet .np .eq i{width:2px;background:var(--green);border-radius:1px;animation:eq 1s infinite ease-in-out}
#greet .np .eq i:nth-child(2){animation-delay:.2s}#greet .np .eq i:nth-child(3){animation-delay:.45s}
@keyframes eq{0%,100%{height:3px}50%{height:10px}}
#greet .row .chk{color:var(--green)}

/* ---------- todo ---------- */
.todo{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;cursor:pointer;position:relative;transition:background .2s}
.todo:hover{background:rgba(255,255,255,.045)}
.todo .cb{flex:none;width:17px;height:17px;border-radius:5px;border:1.5px solid rgba(255,255,255,.35);margin-top:1px;display:grid;place-items:center;transition:all .2s}
.todo.done .cb{background:var(--green);border-color:var(--green)}
.todo.done .cb::after{content:"";width:8px;height:4px;border-left:2px solid #000;border-bottom:2px solid #000;transform:rotate(-45deg) translate(1px,-1px)}
.todo .t{flex:1;font-size:12.5px;line-height:1.45;color:rgba(255,255,255,.88);user-select:text}
.todo.done .t{color:var(--faint);text-decoration:line-through}
.todo .x{opacity:0;color:var(--faint);width:22px;height:22px;border-radius:6px}
.todo:hover .x{opacity:1}.todo .x:hover{background:rgba(255,90,95,.15);color:var(--red)}

/* ---------- timer ---------- */
.tabs{display:flex;gap:4px;padding:3px;margin:0 6px 14px;border-radius:11px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.tabs button{flex:1;height:30px;border-radius:8px;font-size:11.5px;color:var(--dim)}
.tabs button.on{background:rgba(255,255,255,.1);color:#fff}
.ring{position:relative;width:230px;height:230px;margin:6px auto 14px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tt{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .tt b{display:block;font-size:44px;font-weight:300;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ring .tt span{display:block;font-size:10.5px;color:var(--faint);margin-top:2px;letter-spacing:.12em}
.ctrl{display:flex;gap:8px;justify-content:center;margin-bottom:14px}
.ctrl .btn{min-width:84px}
.laps{padding:0 12px;font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.laps div{display:flex;justify-content:space-between;padding:5px 0;border-top:1px solid var(--line)}

/* ---------- weather ---------- */
.wxhero{display:flex;align-items:center;gap:16px;padding:6px 12px 10px}
.wxhero .big{font-size:52px;font-weight:300;letter-spacing:-.03em;line-height:1}
.wxhero .big small{font-size:20px;color:var(--dim);vertical-align:top;margin-left:2px}
.wxhero .d b{display:block;font-size:14px;font-weight:500;text-transform:capitalize}
.wxhero .d span{display:block;font-size:11px;color:var(--faint);margin-top:3px}
.wxmeta{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 6px 6px}
.wxmeta div{border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.025);padding:8px 9px}
.wxmeta div span{display:block;font-size:9px;color:var(--faint);letter-spacing:.08em}
.wxmeta div b{display:block;font-size:13px;font-weight:500;margin-top:3px;font-variant-numeric:tabular-nums}
.wxchart{position:static;width:calc(100% - 12px);height:110px;margin:4px 6px}
.day{display:grid;grid-template-columns:62px 1fr 34px 90px 34px;gap:8px;align-items:center;padding:8px 12px;font-size:11.5px;border-radius:9px}
.day:hover{background:rgba(255,255,255,.035)}
.day .dn{color:rgba(255,255,255,.85)}.day .ds{color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day .lo{color:var(--dim);text-align:right;font-variant-numeric:tabular-nums}.day .hi{font-variant-numeric:tabular-nums}
.day .bar{height:4px;border-radius:4px;background:rgba(255,255,255,.07);position:relative}
.day .bar i{position:absolute;top:0;bottom:0;border-radius:4px;background:linear-gradient(90deg,#4d8dff,#f3c896,#ff8a3d)}

/* ---------- media ---------- */
.np-card{margin:0 6px;border-radius:14px;border:1px solid var(--line);padding:18px;background:radial-gradient(120% 120% at 0% 0%,rgba(243,200,150,.12),transparent 60%),rgba(255,255,255,.02)}
.np-card .src{font-size:9.5px;letter-spacing:.14em;color:var(--faint);display:flex;gap:6px;align-items:center}
.np-card h3{font-size:19px;font-weight:500;margin-top:10px;line-height:1.25;word-wrap:break-word;user-select:text}
.np-card p{font-size:12.5px;color:var(--dim);margin-top:4px;user-select:text}
.np-card .ctrl{margin:18px 0 0;justify-content:flex-start}
.np-card .ctrl .ib{width:42px;height:42px;background:rgba(255,255,255,.06)}
.np-card .ctrl .ib.big{background:#fff;color:#000}
.np-card .ctrl .ib svg{width:17px;height:17px}

/* ---------- clipboard ---------- */
.clip{padding:10px 12px;border-radius:10px;cursor:pointer;transition:background .2s;border:1px solid transparent}
.clip:hover{background:rgba(255,255,255,.045);border-color:var(--line)}
.clip .t{font-size:12px;color:rgba(255,255,255,.85);white-space:pre-wrap;word-break:break-word;max-height:58px;overflow:hidden;font-family:Consolas,"Cascadia Mono",monospace;line-height:1.45}
.clip .m{font-size:9.5px;color:var(--faint);margin-top:4px}

/* ---------- processes ---------- */
.proc{display:grid;grid-template-columns:1fr 64px 46px 26px;gap:8px;align-items:center;padding:6px 12px;font-size:11.5px;border-radius:8px}
.proc:hover{background:rgba(255,255,255,.04)}
.proc .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:rgba(255,255,255,.85)}
.proc .mb{color:var(--dim);text-align:right;font-variant-numeric:tabular-nums}
.proc .bar{height:3px;border-radius:3px;background:rgba(255,255,255,.06);overflow:hidden}.proc .bar i{display:block;height:100%;background:var(--blue)}
.proc .k{opacity:0;width:22px;height:22px;border-radius:6px;color:var(--faint)}
.proc:hover .k{opacity:1}.proc .k:hover{background:rgba(255,90,95,.15);color:var(--red)}

/* hint for camera */
#hint{left:50%;top:84px;transform:translateX(-50%);font-size:10.5px;color:var(--faint);transition:opacity 1s;pointer-events:none}
#gl{cursor:grab}#gl:active{cursor:grabbing}

/* ---------- v3.3 larp: boot sequence + HUD ---------- */
#bootseq{position:fixed;inset:0;z-index:60;display:grid;place-items:center;pointer-events:auto;transition:opacity .9s var(--ease)}
#bootseq.done{opacity:0;pointer-events:none}
#bootseq .box{width:min(460px,86vw);font-family:Consolas,"Cascadia Mono",monospace;font-size:12px;color:rgba(255,255,255,.62);letter-spacing:.04em}
#bootseq .ttl{font-family:var(--font);font-size:13px;font-weight:600;letter-spacing:.38em;color:#fff;margin-bottom:18px;text-align:center}
#bootseq .ttl small{display:block;font-size:9.5px;font-weight:400;letter-spacing:.3em;color:var(--faint);margin-top:6px}
#bootseq .ln{display:flex;justify-content:space-between;gap:12px;padding:3px 0;opacity:0;transform:translateY(4px);transition:all .25s var(--ease)}
#bootseq .ln.on{opacity:1;transform:none}
#bootseq .ln b{font-weight:400;color:var(--warm);text-shadow:0 0 10px var(--warm)}
#bootseq .bar{height:2px;margin-top:16px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
#bootseq .bar i{display:block;height:100%;width:0;background:var(--warm);box-shadow:0 0 12px var(--warm);transition:width .2s linear}
#bootseq .fin{text-align:center;margin-top:16px;color:#fff;opacity:0;transition:opacity .4s;letter-spacing:.2em;font-size:11px}
#bootseq .skip{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);font-family:var(--font);font-size:10.5px;color:var(--faint)}
.hud{position:fixed;z-index:5;left:50%;top:62px;transform:translateX(-50%);pointer-events:none;font-family:Consolas,"Cascadia Mono",monospace;font-size:9.5px;letter-spacing:.16em;color:rgba(255,255,255,.42);line-height:1.9;transition:opacity .5s;white-space:nowrap}
.hud b{font-weight:400;color:rgba(255,255,255,.82)}
.hud i{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--warm);box-shadow:0 0 8px var(--warm);margin-right:7px;vertical-align:1px}
.hud .ln{display:block;width:60px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.25));margin:4px 0}
#hudL{display:flex;gap:18px;align-items:center}#hudL .sep{width:1px;height:10px;background:rgba(255,255,255,.18)}#hudR{display:none}
.focused .hud,.modal-open .hud{opacity:0!important}

/* ---------- v3.4: bead bracelet (quick actions) ---------- */
:root{--acc-rgb:169,139,255;--acc2-rgb:77,217,255}
#beads{right:22px;bottom:18px;display:flex;align-items:center;gap:9px;padding:10px 14px;position:fixed}
#beads::before{content:"";position:absolute;left:8px;right:8px;top:50%;height:1px;transform:translateY(-50%);
  background:linear-gradient(90deg,transparent,rgba(var(--acc-rgb),.35) 15%,rgba(var(--acc2-rgb),.35) 85%,transparent)}
.bead{position:relative;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.42),rgba(255,255,255,.06) 22%,transparent 38%),
             radial-gradient(circle at 50% 60%,rgba(var(--acc-rgb),.30),rgba(12,10,22,.95) 72%);
  border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 -3px 6px rgba(0,0,0,.6),0 4px 12px rgba(0,0,0,.5),0 0 0 rgba(var(--acc-rgb),0);
  color:rgba(255,255,255,.72);transition:transform .35s var(--ease),box-shadow .35s var(--ease),color .2s}
.bead svg{width:13px;height:13px;filter:drop-shadow(0 0 4px rgba(var(--acc-rgb),.6))}
.bead:hover{transform:translateY(-4px) scale(1.08);color:#fff;box-shadow:inset 0 -3px 6px rgba(0,0,0,.5),0 8px 18px rgba(0,0,0,.5),0 0 18px rgba(var(--acc-rgb),.55)}
.bead:active{transform:translateY(-1px) scale(.96)}
.bead.on{box-shadow:inset 0 -3px 6px rgba(0,0,0,.5),0 0 14px rgba(var(--acc2-rgb),.7);color:#fff}
.bead::after{content:attr(data-tip);position:absolute;bottom:42px;left:50%;transform:translate(-50%,6px);opacity:0;pointer-events:none;white-space:nowrap;
  font-size:10.5px;padding:5px 10px;border-radius:8px;background:rgba(16,14,24,.94);border:1px solid rgba(var(--acc-rgb),.35);color:#fff;transition:all .2s var(--ease)}
.bead:hover::after{opacity:1;transform:translate(-50%,0)}
.bead.flash{animation:beadflash .7s var(--ease)}
@keyframes beadflash{0%{box-shadow:0 0 0 0 rgba(var(--acc2-rgb),.8)}100%{box-shadow:0 0 0 14px rgba(var(--acc2-rgb),0)}}
.modal-open #beads{opacity:.25}

/* ---------- v3.4: premium glass polish ---------- */
.pill,#bar,#side,.modal,#rail,#tools{box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 10px 40px rgba(0,0,0,.35)}
#bar{box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 10px 40px rgba(0,0,0,.5),0 0 0 0 rgba(var(--acc-rgb),0)}
#bar:focus-within{border-color:rgba(var(--acc-rgb),.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 10px 50px rgba(0,0,0,.6),0 0 24px rgba(var(--acc-rgb),.18)}
#side{background:linear-gradient(180deg,rgba(22,20,30,.72),rgba(12,12,16,.66));border-color:rgba(255,255,255,.07)}
#side::before{content:"";position:absolute;left:18px;right:18px;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(var(--acc-rgb),.55),transparent)}
.modal::before{content:"";position:absolute;left:24px;right:24px;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(var(--acc-rgb),.5),transparent)}
#side .item,#side .todo,#side .clip{transition:background .2s,transform .25s var(--ease)}
#side .item:hover,#side .todo:hover{transform:translateX(2px)}
.focused #side{animation:sidein .55s var(--ease)}
@keyframes sidein{from{opacity:0;transform:translateX(26px) scale(.985)}to{opacity:1;transform:none}}
#send{background:linear-gradient(180deg,#fff,#dcd6ff)}
.rb.on{box-shadow:inset 0 0 0 1px rgba(var(--acc-rgb),.35),0 0 14px rgba(var(--acc-rgb),.18)}
.lab b{letter-spacing:.03em}
#greet h1{background:linear-gradient(180deg,#fff 30%,rgba(255,255,255,.72));-webkit-background-clip:text;background-clip:text;color:transparent}
.hud span{pointer-events:auto;cursor:pointer;transition:color .2s}.hud span:hover{color:#fff}
::selection{background:rgba(var(--acc-rgb),.35)}

/* ---------- v3.5: Vzhled ---------- */
#looks{width:min(620px,calc(100vw - 40px))}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}
.vrow{display:grid;grid-template-columns:1fr 46px;gap:2px 8px;align-items:center}
.vrow label{grid-column:1/3;margin:0!important}
.vrow span{font-size:10.5px;color:var(--dim);text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:4px;background:linear-gradient(90deg,rgba(var(--acc-rgb),.7),rgba(255,255,255,.1));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(var(--acc-rgb),.35),0 0 12px rgba(var(--acc-rgb),.6);cursor:pointer}

/* ===== v3.6 modules ===== */
.tt-hero{margin:0 6px 12px;padding:14px 16px;border-radius:14px;border:1px solid rgba(var(--acc-rgb),.28);background:linear-gradient(135deg,rgba(var(--acc-rgb),.12),rgba(var(--acc2-rgb),.04))}

.tt-hero .n{font-size:24px;font-weight:500;margin:4px 0 2px}
.tt-hero .m{font-size:11.5px;color:var(--dim)}
.tt-hero .bar,.fl-deck .bar{height:3px;border-radius:3px;background:rgba(255,255,255,.08);margin-top:10px;overflow:hidden}
.tt-hero .bar i,.fl-deck .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--warm),rgba(var(--acc2-rgb),1));border-radius:3px;transition:width .6s var(--ease)}
.tt-tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:0 6px 10px;padding:3px;border-radius:11px;background:rgba(255,255,255,.035);border:1px solid var(--line)}
.tt-tabs button{height:34px;border-radius:8px;font-size:12px;color:var(--dim);position:relative;transition:all .2s}

.tt-tabs button.on{background:rgba(255,255,255,.1);color:#fff}
.tt-row{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:10px;padding:9px 12px;margin:0 6px 4px;border-radius:10px;border:1px solid transparent;cursor:pointer;transition:all .2s}
.tt-row:hover{background:rgba(255,255,255,.04);border-color:var(--line)}
.tt-row.live{background:rgba(var(--acc-rgb),.1);border-color:rgba(var(--acc-rgb),.35)}
.tt-row .tm{font-size:12.5px;font-variant-numeric:tabular-nums;line-height:1.15}
.tt-row .tm small{display:block;font-size:10px;color:var(--faint)}
.tt-row .nm{font-size:13.5px}
.tt-row .rm{font-size:10.5px;color:var(--faint);padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.05)}
.tt-row .rm:empty{display:none}
.tt-row.edit{grid-template-columns:54px 54px 1fr 56px auto auto;gap:5px;padding:6px;cursor:default;background:rgba(255,255,255,.04);border-color:var(--line2)}
.tt-row.edit .inp{height:32px;border-radius:8px;border:1px solid var(--line2);background:rgba(0,0,0,.25);padding:0 8px;font-size:12px;width:100%}
.fl-deck{margin:0 6px 10px;padding:14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.025)}
.fl-deck .top{display:flex;justify-content:space-between;align-items:center}
.fl-deck .nm{font-size:15px;font-weight:500}
.fl-deck .lg{font-size:9.5px;letter-spacing:.1em;color:var(--faint);border:1px solid var(--line2);border-radius:5px;padding:1px 5px}
.fl-deck .m{font-size:11.5px;color:var(--dim);margin-top:3px}
.fl-langs{display:flex;flex-wrap:wrap;gap:5px;margin:0 6px 8px}
.chip.on{background:rgba(var(--acc-rgb),.18);border-color:rgba(var(--acc-rgb),.5);color:#fff}
.fl-ta{width:calc(100% - 12px);margin:0 6px;height:220px;resize:vertical;border-radius:12px;border:1px solid var(--line2);background:rgba(255,255,255,.035);padding:12px;font-size:13px;line-height:1.55}
.fl-ta:focus{border-color:rgba(var(--acc-rgb),.5)}
.fl-top{display:flex;justify-content:space-between;align-items:center;margin:0 6px 12px;font-size:11px;color:var(--faint)}
.fl-card{position:relative;height:230px;margin:0 6px;perspective:1100px;cursor:pointer}
.fl-card .face{position:absolute;inset:0;border-radius:18px;border:1px solid rgba(var(--acc-rgb),.3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center;
  backface-visibility:hidden;transition:transform .55s var(--ease);background:radial-gradient(120% 90% at 50% 0%,rgba(var(--acc-rgb),.16),rgba(14,14,18,.85) 70%);box-shadow:0 20px 50px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08)}
.fl-card .face.b{transform:rotateY(180deg);background:radial-gradient(120% 90% at 50% 0%,rgba(var(--acc2-rgb),.16),rgba(14,14,18,.85) 70%)}

.fl-card .tag{position:absolute;top:14px;left:16px;font-size:9px;letter-spacing:.18em;color:var(--faint)}

.fl-card .w.sm{font-size:13px;color:var(--dim);font-weight:400}
.fl-card .hint{position:absolute;bottom:14px;font-size:10px;color:var(--faint)}

.fl-btns button small{font-size:9px;color:var(--faint);margin-top:2px}
.fl-btns .bad:hover{background:rgba(255,90,95,.18);border-color:rgba(255,90,95,.45)}
.fl-btns .mid:hover{background:rgba(255,170,60,.16);border-color:rgba(255,170,60,.45)}

.fl-done .big{font-size:64px;font-weight:200;color:var(--warm)} .fl-done .big small{font-size:22px}
.fl-done .m{font-size:12.5px;color:var(--dim)}
.hb-sum{display:flex;align-items:center;gap:14px;margin:0 6px 12px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.025)}
.hb-sum .hbring{--p:0;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--warm) calc(var(--p)*1%),rgba(255,255,255,.08) 0);position:relative}
.hb-sum .hbring::before{content:"";position:absolute;inset:5px;border-radius:50%;background:#101014}
.hb-sum .hbring b{position:relative;font-size:12.5px;font-weight:500}

  r.setProperty("--acc-rgb", t.c1.map(v=>Math.round(v*255)).join(",")); r.setProperty("--acc2-rgb", t.c2.map(v=>Math.round(v*255)).join(",")); }

/* ============================================================
   WEBGL2 — everything on the GPU: sky + core (fullscreen pass),
   constellation points, links and orbit arcs (instanced geometry)
   ============================================================ */
const glc = $("#gl");
const gl = glc.getContext("webgl2", {antialias:true, alpha:false, powerPreference:"high-performance", premultipliedAlpha:false});
const FS = `#version 300 es
precision highp float;
uniform vec2 uRes; uniform float uT; uniform vec2 uC; uniform float uF; uniform float uE; uniform float uI;
uniform mat3 uCam; uniform vec3 uPos; uniform vec3 uCol; uniform vec3 uCol2;
uniform float uStyle, uFog, uStars, uGlow, uFlare, uRingN, uSpin;
uniform sampler2D uDay, uNight, uCloud; uniform float uTex, uEYaw, uCloudT, uHolo, uReveal; uniform vec3 uSun;
out vec4 o;

float h31(vec3 p){ p=fract(p*vec3(.1031,.1030,.0973)); p+=dot(p,p.yxz+33.33); return fract((p.x+p.y)*p.z); }
float n3(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.-2.*f);
  return mix(mix(mix(h31(i),h31(i+vec3(1,0,0)),f.x),mix(h31(i+vec3(0,1,0)),h31(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(h31(i+vec3(0,0,1)),h31(i+vec3(1,0,1)),f.x),mix(h31(i+vec3(0,1,1)),h31(i+vec3(1,1,1)),f.x),f.y),f.z); }
float fbm(vec3 p, int oct){ float v=0.,a=.5; for(int i=0;i<6;i++){ if(i>=oct) break; v+=a*n3(p); p=p*2.03+vec3(1.7,9.2,3.1); a*=.5; } return v; }
float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
mat3 rotY(float a){ float c=cos(a), s=sin(a); return mat3(c,0.,-s, 0.,1.,0., s,0.,c); }
mat3 rotX(float a){ float c=cos(a), s=sin(a); return mat3(1.,0.,0., 0.,c,s, 0.,-s,c); }
mat3 rotZ(float a){ float c=cos(a), s=sin(a); return mat3(c,s,0., -s,c,0., 0.,0.,1.); }
float aaLine(float d, float w){ float fw = fwidth(d)*1.2 + 1e-5; return 1. - smoothstep(w - fw, w + fw, abs(d)); }

const float RC = 0.155;          // outer glass shell
const float RI = 0.092;          // inner plasma heart

vec3 sky(vec3 d){
  vec3 q = d*1.5 + vec3(uT*.004, 0., uT*.002);
  float f = fbm(q + .7*fbm(q*1.7, 4), 5);
  float fog = smoothstep(.42,1.0,f);
  vec3 c = mix(vec3(.10,.10,.112), uCol*.13, .35)*fog*1.65*uFog;
  // two star layers (fine + bright), crisp
  vec3 a = abs(d); vec2 uv; float face;
  if (a.x>a.y && a.x>a.z){ uv=d.yz/a.x; face=sign(d.x); } else if (a.y>a.z){ uv=d.xz/a.y; face=2.+sign(d.y); } else { uv=d.xy/a.z; face=4.+sign(d.z); }
  for (int L=0; L<2; L++){
    float sc = L==0 ? 260. : 90.;
    vec2 g = uv*sc + face*31.7 + float(L)*17.; vec2 id=floor(g); float h=h21(id);
    vec2 off=vec2(h21(id+1.3),h21(id+2.1))-.5;
    float dd = length(fract(g)-.5-off*.6);
    float px = clamp(fwidth(g.x)*1.2, .02, .25);
    float st = step(L==0 ? 1. - .016*uStars : 1. - .007*uStars, h) * smoothstep(px*1.6, 0., dd) * min(uStars, 1.);
    float tw = .65+.35*sin(uT*(1.2+h*2.)+h*60.);
    c += mix(vec3(.85,.9,1.), mix(vec3(1.,.85,.7), vec3(.7,.8,1.), h21(id+5.)), .4) * st * (L==0 ? .35+.5*h21(id+7.) : 1.1) * tw;
  }
  return c;
}

// hexagonal panel field on the sphere (lat/long chart, 2 charts blended near poles)
vec4 hexDist(vec2 p){
  const vec2 s = vec2(1., 1.7320508);
  vec4 hc = floor(vec4(p, p - vec2(.5, 1.))/s.xyxy) + .5;
  vec4 h = vec4(p - hc.xy*s, p - (hc.zw + .5)*s);
  return dot(h.xy,h.xy) < dot(h.zw,h.zw) ? vec4(h.xy, hc.xy) : vec4(h.zw, hc.zw + 9.43);
}
float hexEdge(vec2 h){ vec2 a = abs(h); return .5 - max(dot(a, normalize(vec2(1.,1.7320508))), a.x); }

vec4 shellLayer(vec3 n, vec3 rd, float front){
  mat3 spin = rotY(-uT*.12*uSpin)*rotX(.35);
  vec3 q = spin*n;
  float lat = asin(clamp(q.y,-1.,1.)), lon = atan(q.z,q.x);
  vec2 uvh = vec2(lon*3.0, lat*3.3);
  vec4 hx = hexDist(uvh);
  float edge = hexEdge(hx.xy);
  float line = aaLine(edge, .025);
  float cellR = h21(hx.zw);
  float lit = step(.94, cellR) * (.55 + .45*sin(uT*(1.+cellR*3.) + cellR*40.));
  float pole = smoothstep(.96, .995, abs(q.y));
  float fres = pow(1. - abs(dot(n, -rd)), 2.2);
  // scan band sweeping across the shell
  float scan = exp(-pow((q.y - sin(uT*.55)*.9)*14., 2.));
  vec3 c = uCol*(line*(.28 + .35*fres)*(1.-pole) + lit*.14*(1.-pole) + fres*.95) + uCol2*fres*fres*.45 + mix(uCol, vec3(1.), .5)*scan*.18;
  float a = clamp(line*.32 + fres*.55 + lit*.1 + scan*.12, 0., 1.);
  c *= front > .5 ? 1. : .38; a *= front > .5 ? 1. : .45;
  return vec4(c, a);
}


// ---------- style 1: hologram wireframe globe
vec4 holoLayer(vec3 n, vec3 rd, float front){
  mat3 spin = rotY(-uT*.18*uSpin)*rotX(.25);
  vec3 q = spin*n;
  float lat = asin(clamp(q.y,-1.,1.)), lon = atan(q.z,q.x);
  float l1 = aaLine(fract(lat*12./3.14159)-.5, .045)*(1.-smoothstep(.9,.99,abs(q.y)));
  float l2 = aaLine(fract(lon*16./6.28318)-.5, .03)*(1.-smoothstep(.85,.99,abs(q.y)));
  float dots = smoothstep(.6,1.,(1.-abs(fract(lat*12./3.14159)-.5)*2.)*(1.-abs(fract(lon*16./6.28318)-.5)*2.));
  float fres = pow(1. - abs(dot(n, -rd)), 2.);
  float scan = exp(-pow((q.y - sin(uT*.7)*.95)*10., 2.));
  float a = clamp((l1+l2)*.6 + fres*.4 + scan*.3 + dots*.0, 0., 1.);
  vec3 c = uCol*((l1+l2)*.9 + fres*.9 + scan*.5) + uCol2*fres*.3;
  return front > .5 ? vec4(c, a) : vec4(c*.35, a*.4);
}
// ---------- style 2: planet
vec3 planet(vec3 n, vec3 rd){
  mat3 spin = rotY(uT*.05*uSpin)*rotX(.4);
  vec3 q = spin*n;
  float land = smoothstep(.5,.54, fbm(q*1.7+3., 5));
  float clouds = smoothstep(.55,.85, fbm(q*2.6 + vec3(uT*.03,0.,0.), 4))*.8;
  vec3 L = normalize(vec3(-.6,.45,.65));
  vec3 Lv = normalize(uCam*vec3(-.5,.4,.7));            // light from the camera's upper-left
  float dif = clamp(dot(n, Lv), 0., 1.);
  vec3 ocean = mix(vec3(.02,.03,.08), uCol*.25, .35);
  vec3 ground = mix(vec3(.08,.10,.08), uCol2*.4 + vec3(.1,.1,.08), .5) * (.7 + .5*fbm(q*6.,3));
  vec3 base = mix(ocean, ground, land);
  float spec = pow(clamp(dot(reflect(-Lv, n), -rd), 0., 1.), 40.)*(1.-land)*.6;
  vec3 col = base*(.08 + dif*1.1) + spec*vec3(1.);
  float night = smoothstep(.15, -.1, dot(n, Lv));
  float city = step(.88, h31(floor(q*90.)))*land*night;
  col += mix(uCol, vec3(1.,.85,.6), .6)*city*1.3;
  col = mix(col, vec3(1.)*(.12 + dif*1.), clouds*(.25+.75*dif));
  float rim = pow(1. - max(dot(n,-rd),0.), 3.);
  col += uCol*rim*(.6 + dif*.8) + uCol2*rim*rim*.4;
  return col;
}

// ---------- style 2 (textured): realistic Earth
const float PI = 3.14159265;
vec3 toLin(vec3 c){ return c*c*(.3 + .7*c); }
vec3 sampleEq(sampler2D t, vec3 n, float uOff){
  float lon = atan(n.x, n.z), lat = asin(clamp(n.y,-1.,1.));
  vec2 uv = vec2(lon/(2.*PI) + .5 + uOff, .5 - lat/PI);
  vec2 uv2 = vec2(fract(uv.x + .5), uv.y);
  vec2 dx = dFdx(uv), dy = dFdy(uv), dx2 = dFdx(uv2), dy2 = dFdy(uv2);
  if (abs(dx2.x) + abs(dy2.x) < abs(dx.x) + abs(dy.x)) { dx = dx2; dy = dy2; }
  return textureGrad(t, vec2(fract(uv.x), uv.y), dx, dy).rgb;
}
vec3 earthSurf(vec3 nW, vec3 rd){
  mat3 W = rotY(uEYaw);                       // earth frame -> world
  vec3 n = transpose(W)*nW;                    // earth-fixed normal
  vec3 s = uSun;                               // sun dir in earth frame (real time)
  vec3 sW = W*s;
  vec3 day = toLin(sampleEq(uDay, n, 0.));
  vec3 nl  = sampleEq(uNight, n, 0.);
  float cl = sampleEq(uCloud, n, uCloudT).r;
  float clS = sampleEq(uCloud, normalize(n - s*.012), uCloudT).r;   // cloud shadow
  float water = smoothstep(.015, .09, day.b - max(day.r, day.g)*.92) * (1. - smoothstep(.55, .75, day.r+day.g));
  float mu = dot(n, s);
  float dif = clamp(mu*1.15 + .05, 0., 1.);
  float twi = exp(-pow(mu/.11, 2.));                       // twilight band
  vec3 sunCol = mix(vec3(1., .55, .32), vec3(1., .97, .92), smoothstep(0., .35, mu));
  vec3 surf = day*(1. - clS*.55*dif)*sunCol*dif*1.9;
  // ocean glint
  vec3 v = -rd, h = normalize(sW + v);
  float ndh = max(dot(nW, h), 0.);
  surf += water*(pow(ndh, 160.)*2.6 + pow(ndh, 18.)*.12)*sunCol*step(0., mu)*(1. - cl);
  // city lights on the night side
  float nightM = smoothstep(.06, -.18, mu);
  vec3 lights = toLin(nl)*vec3(1.25, .95, .7);
  surf += lights*nightM*(1. - cl*.8)*3.4 + day*vec3(.5,.6,1.)*.018*nightM;
  // clouds
  vec3 cloudC = vec3(.95)*(dif*1.55 + twi*.12*vec3(1.,.6,.4)) + vec3(.02,.025,.04);
  surf = mix(surf, cloudC, cl*.92);
  // atmosphere: limb scattering, lit side bluish, sunset rim
  float vd = max(dot(nW, v), 0.);
  float fres = pow(1. - vd, 3.2);
  float lit = smoothstep(-.25, .45, mu);
  vec3 atm = vec3(.28, .55, 1.)*lit + vec3(1., .45, .2)*twi*.35;
  surf = mix(surf, atm*1.2, fres*.85*lit + fres*.04);
  surf += vec3(.08,.18,.45)*pow(1. - vd, 1.4)*lit*.35;
  // holographic overlay: graticule, equator, scan band, limb ticks
  if (uHolo > .01){
    float lat = asin(clamp(n.y,-1.,1.))*57.2958, lon = atan(n.x, n.z)*57.2958;
    float dLa = abs(fract(lat/15. + .5) - .5)*15., dLo = abs(fract(lon/15. + .5) - .5)*15.*cos(radians(lat));
    float gd = min(dLa, dLo), fw = fwidth(gd)*1.3 + 1e-4;
    float grid = 1. - smoothstep(0., fw, gd);
    float eq = 1. - smoothstep(0., fwidth(lat)*1.6 + 1e-4, abs(lat));
    float scanLat = mod(uT*6., 200.) - 100.;
    float band = exp(-pow((lat - scanLat)/2.2, 2.)) + .35*exp(-pow((lat - scanLat)/9., 2.));
    float edge = .2 + .8*fres;
    vec3 hc = mix(uCol, vec3(.6,.9,1.), .35);
    surf += hc*(grid*.16*edge + eq*.35*edge + band*.10)*uHolo;
  }
  return surf;
}

vec3 earth(vec3 nW, vec3 rd){
  vec3 n = transpose(rotY(uEYaw))*nW;
  float lat = asin(clamp(n.y,-1.,1.))*57.2958, lon = atan(n.x, n.z)*57.2958;
  float vd = max(dot(nW, -rd), 0.), fres = pow(1. - vd, 2.2);
  vec3 hc = mix(uCol, vec3(.6,.9,1.), .35);
  // hologram shell (shown before / while revealing)
  float dLa = abs(fract(lat/10. + .5) - .5)*10., dLo = abs(fract(lon/10. + .5) - .5)*10.*cos(radians(lat));
  float gd = min(dLa, dLo); float grid = 1. - smoothstep(0., fwidth(gd)*1.4 + 1e-4, gd);
  float flick = .85 + .15*sin(uT*23. + lat*.3);
  vec3 holoC = vec3(.004,.008,.02) + hc*(grid*.2 + fres*.45)*(.95 + .05*sin(uT*9.));
  if (uReveal >= 1.) return earthSurf(nW, rd);
  float rl = 92. - uReveal*190.;                       // reveal latitude sweeps north -> south
  float m = smoothstep(rl - 4., rl + 4., lat);
  vec3 c = uReveal > 0. ? mix(holoC, earthSurf(nW, rd), m) : holoC;
  float edge = exp(-pow((lat - rl)/3.5, 2.));
  c += hc*edge*.9*step(.001, uReveal) + vec3(1.)*edge*edge*.15*step(.001, uReveal);
  return c;
}
// ---------- style 3: crystal (faceted octahedron)
float sdCrystal(vec3 p){ p = rotY(uT*.2*uSpin)*p; p.y *= .72; vec3 a = abs(p); return (a.x+a.y+a.z - .112)*.577; }
vec3 nCrystal(vec3 p){ vec2 e = vec2(.0006,0.); return normalize(vec3(sdCrystal(p+e.xyy)-sdCrystal(p-e.xyy), sdCrystal(p+e.yxy)-sdCrystal(p-e.yxy), sdCrystal(p+e.yyx)-sdCrystal(p-e.yyx))); }
vec4 crystal(vec3 ro, vec3 rd, float tEnter){
  float t = max(tEnter, 0.); bool hit = false;
  for (int i=0;i<64;i++){ float d = sdCrystal(ro+rd*t); if (d < .0004){ hit = true; break; } t += d; if (t > tEnter + .5) break; }
  if (!hit) return vec4(0.);
  vec3 p = ro + rd*t, n = nCrystal(p);
  vec3 q = rotY(uT*.2*uSpin)*p; q.y *= .72; vec3 a = abs(q);
  float edge = 1. - smoothstep(.0, .006, min(min(abs(a.x-a.y), abs(a.y-a.z)), abs(a.x-a.z))*1.0 + abs(a.x+a.y+a.z-.112)*0.);
  edge = max(edge, 1. - smoothstep(0., .005, min(min(a.x,a.y),a.z)));
  float fres = pow(1. - abs(dot(n,-rd)), 2.5);
  float inner = .45 + .55*fbm(q*14. + uT*.3, 3);
  vec3 refl = sky(reflect(rd, n));
  vec3 c = mix(uCol*.08, uCol*.75, inner*inner)*(.4 + .6*(1.-fres)) + uCol2*fres*.85 + refl*.3 + mix(uCol,vec3(1.),.65)*edge*1.1;
  c += vec3(1.)*pow(clamp(dot(reflect(rd,n), normalize(vec3(.4,.8,.3))),0.,1.), 30.)*.8;
  return vec4(c, t);
}
// returns rgb (premultiplied) and alpha of the ring at this ray, plus hit distance in .w of second vec
void ringHit(vec3 ro, vec3 rd, mat3 R, float rad, float kind, float spd, vec3 col, inout vec3 acc, inout float accA, float tLimitFront, inout vec3 front){
  vec3 o = R*ro, d = R*rd;
  if (abs(d.y) < 1e-5) return;
  float t = -o.y/d.y; if (t < 0.) return;
  vec3 p = o + d*t; float r = length(p.xz);
  if (r > rad*1.2 || r < rad*.8) return;          // only near the ring (no smeared horizon line)
  if (abs(d.y) < .02) return;                     // grazing angle: skip
  float ang = atan(p.z, p.x);
  float a = 0.;
  if (kind < .5){             // double band + tick scale
    a += aaLine(r - rad*1.0, rad*.006) + aaLine(r - rad*1.045, rad*.004)*.7;
    float bead = exp(-pow(mod(ang - uT*spd + 3.14159, 6.2831853) - 3.14159, 2.)*900.) * exp(-pow((r-rad)/(rad*.02),2.));
    a += bead*2.5;
  } else if (kind < 1.5){     // dashed segments
    float seg = smoothstep(.0, .05, sin(ang*9. + uT*spd)) ;
    a += aaLine(r - rad, rad*.012)*seg;
    a += aaLine(r - rad*.965, rad*.003)*.5;
  } else {                    // fine line + 3 beads
    a += aaLine(r - rad, rad*.0035)*.8;
    for (int k=0;k<3;k++){ float ph = ang - uT*spd - float(k)*2.0943951; ph = mod(ph+3.14159, 6.2831853)-3.14159;
      a += exp(-ph*ph*1400.)*exp(-pow((r-rad)/(rad*.015),2.))*2.; }
  }
  a = clamp(a, 0., 3.);
  if (t < tLimitFront) front += col*a; else { acc += col*a*(1.-accA); }
}

void main(){
  vec2 fc = gl_FragCoord.xy;
  vec3 rd = normalize(uCam * normalize(vec3((fc - uC)/uF, -1.)));
  vec3 ro = uPos;
  float E = uE;
  vec3 col = sky(rd);

  // halo + anamorphic flare
  float tca = -dot(ro, rd); vec3 pc = ro + rd*max(tca,0.); float dmin = length(pc);
  float pr = RC*uF/length(ro);                        // projected shell radius (px)
  vec2 dp = fc - uC;
  float halo = exp(-max(dmin-RC,0.)*10.)*(.22+.45*E) + exp(-max(dmin-RC,0.)*32.)*(.3+.4*E);
  float flare = exp(-abs(dp.y)/(pr*.04+1.)) * exp(-abs(dp.x)/(pr*4.5)) * (.05 + .2*E);
  bool isEarth = uStyle > 1.5 && uStyle < 2.5 && uTex > .5;
  if (isEarth){
    float lf = smoothstep(-.35, .6, dot(normalize(pc), rotY(uEYaw)*uSun))*smoothstep(.0, .8, uReveal);
    float ah = (dmin > RC ? exp(-(dmin-RC)*95.) : 0.)*smoothstep(.15, 1., uReveal);
    col += (vec3(.25,.5,1.)*ah*1.1 + vec3(.2,.45,1.)*exp(-max(dmin-RC,0.)*16.)*.08)*lf*uGlow + vec3(1.,.5,.25)*ah*.2*exp(-pow(dot(normalize(pc), rotY(uEYaw)*uSun)/.25,2.))*uGlow;
    col += mix(uCol, vec3(1.), .8)*flare*uFlare*.3;
  } else
  col += uCol*halo*.5*uGlow + mix(uCol, vec3(1.), .6)*flare*uFlare;

  // sphere intersections
  float b = dot(ro, rd), c = dot(ro,ro) - RC*RC, disc = b*b - c;
  float tShell = 1e9; vec4 shellF = vec4(0.), shellB = vec4(0.); vec3 inner = vec3(0.); float innerA = 0.;
  if (disc > 0.){
    float sq = sqrt(disc); float t0 = -b - sq, t1 = -b + sq;
    if (t0 > 0. && uStyle > 2.5){            // crystal
      vec4 cr = crystal(ro, rd, t0);
      if (cr.w > 0.){ tShell = cr.w; inner = cr.rgb; innerA = 1.; }
    } else if (t0 > 0. && uStyle > 1.5){      // planet
      tShell = t0; inner = uTex > .5 ? earth((ro + rd*t0)/RC, rd) : planet((ro + rd*t0)/RC, rd); innerA = 1.;
    } else if (t0 > 0. && uStyle > .5){       // hologram
      tShell = t0;
      vec3 nF = (ro + rd*t0)/RC, nB = (ro + rd*t1)/RC;
      shellF = holoLayer(nF, rd, 1.); shellB = holoLayer(-nB, -rd, 0.);
      float dc = length(cross(ro, rd));
      inner = uCol*exp(-dc*dc*600.)*(1.2+E); innerA = 0.;
    } else if (t0 > 0.){
      tShell = t0;
      vec3 nF = (ro + rd*t0)/RC, nB = (ro + rd*t1)/RC;
      shellF = shellLayer(nF, rd, 1.);
      shellB = shellLayer(-nB, -rd, 0.);
      // inner heart
      float bi = dot(ro, rd), ci = dot(ro,ro) - RI*RI, di = bi*bi - ci;
      // volumetric glow through the whole shell (cheap), denser inside heart
      float L = t1 - t0; float acc = 0.;
      mat3 spin = rotY(uT*.3);
      for (int i=0;i<16;i++){
        float tt = t0 + L*(float(i)+.5)/16.;
        vec3 p = ro + rd*tt; float rr = length(p)/RI;
        vec3 q = spin*p/RI;
        float dn = fbm(q*1.9 + vec3(sin(uT*.3+q.y*2.)*.4, uT*.4, cos(uT*.27)*.3), 4);
        float heart = smoothstep(1.15, .2, rr);
        float tendr = smoothstep(.55, .95, dn) * smoothstep(1.7, .9, rr);
        acc += (heart*(.6 + .9*dn) + tendr*.9 + exp(-rr*rr*(9. - 4.*E))*2.2) * (L/RC) / 16.;
      }
      inner = mix(uCol, vec3(1.), .5)*acc*(.9 + 1.3*E) + uCol2*acc*.12;
      innerA = clamp(acc*.55, 0., 1.);
      if (di > 0.){                    // crisp rim on the heart
        vec3 nh = (ro + rd*(-bi - sqrt(di)))/RI;
        float fr = pow(1. - max(dot(nh,-rd),0.), 3.);
        inner += uCol*fr*.8;
      }
      inner *= 1. + E*.3*sin(atan(nF.y, length(nF.xz))*12. - uT*8.);
    }
  }

  // rings
  float sp = 1. + E*2.2;
  vec3 ringBack = vec3(0.), ringFront = vec3(0.); float dummy = 0.;
  vec3 rc1 = mix(uCol, vec3(1.), .4);
  if (uRingN > .5) ringHit(ro, rd, rotX(.32+.12*sin(uT*.21))*rotY(uT*.09*sp*uSpin), RC*1.72, 0., .55*sp, rc1, ringBack, dummy, tShell, ringFront);
  if (uRingN > 1.5) ringHit(ro, rd, rotZ(1.05)*rotX(uT*.12*sp*uSpin), RC*2.2, 1., -.5*sp, uCol, ringBack, dummy, tShell, ringFront);

  // composite back-to-front
  col += ringBack*.85;
  col = mix(col, col + shellB.rgb, shellB.a);
  col = uStyle > 1.5 ? (innerA > .5 ? inner : col) : col*(1. - innerA*.85) + inner;
  col = mix(col, col + shellF.rgb, shellF.a);
  col += ringFront*.95;

// ---------- pass 4: orbit arcs (comet-like trails on big tilted circles)
const arcProg = mkProg(`#version 300 es
precision highp float;
layout(location=0) in vec4 aR;   // radius, tiltX, tiltZ, speed

/* ============================================================

   ============================================================ */
let rng = 1337; const rnd = () => (rng = (rng*1664525+1013904223)>>>0) / 4294967296;

let CL = [];
function buildGalaxy(){
  rng = 1337; CL = [];

  const N = GROUPS.length, ga = Math.PI*(3-Math.sqrt(5));
  GROUPS.forEach((m, k) => {
    const y = (1 - (k+.5)/N*2) * .62;
    const rr = Math.sqrt(1-y*y), th = k*ga + .4, rad = 0.78;
    const c = {id:m.id, g:m, name:m.name, x:Math.cos(th)*rr*rad, y:y*rad*.9, z:Math.sin(th)*rr*rad, k};
    CL.push(c);
    const [cnt] = moduleCount(m.m[0]);
    const n = 230 + Math.min((typeof cnt==="number"?cnt:15)*6, 160);
    const pts = [];
    for (let i=0;i<n;i++){
      const s = 0.15 + 0.05*rnd();
      const p = [c.x+gauss()*s, c.y+gauss()*s*.8, c.z+gauss()*s];
      pts.push(p); pos.push(...p); info.push(.4+rnd()*1.0, k, rnd()*6.28, rnd()<.08?1:0); orb.push(0,0,0,0);
    }
    for (let i=0;i<pts.length;i++){
      let best=-1, bd=1e9, best2=-1, bd2=1e9;
      for (let j=0;j<pts.length;j++){ if(i===j) continue;
        const dx=pts[i][0]-pts[j][0], dy=pts[i][1]-pts[j][1], dz=pts[i][2]-pts[j][2], d=dx*dx+dy*dy+dz*dz;
        if (d<bd){ bd2=bd; best2=best; bd=d; best=j; } else if (d<bd2){ bd2=d; best2=j; } }
      if (best>i && bd<0.006){ lpos.push(...pts[i], ...pts[best]); lcl.push(k,k); }
      if (best2>i && bd2<0.005 && rnd()<.5){ lpos.push(...pts[i], ...pts[best2]); lcl.push(k,k); }

    const u=rnd()*2-1, t=rnd()*Math.PI*2, r=.32+Math.pow(rnd(),.65)*1.05, s=Math.sqrt(1-u*u);
    pos.push(Math.cos(t)*s*r, u*r*.78, Math.sin(t)*s*r); info.push(.15+rnd()*.6, -1, rnd()*6.28, rnd()<.02?1:0); orb.push(0,0,0,0);

    const r=.42+Math.pow(rnd(),1.4)*.42, t=rnd()*Math.PI*2;
    pos.push(0, gauss()*.006*(r*6), 0); info.push(.2+rnd()*.6, -2, rnd()*6.28, rnd()<.015?1:0); orb.push(1, r, t, .22/Math.pow(r*2.6,1.5));

  const L = $("#labels"); L.innerHTML="";
  CL.forEach(c => { const el = document.createElement("div"); el.className="lab"; el.innerHTML = `<b>${c.name}</b><span></span>`;
    el.onclick = () => openGroup(c.g); L.appendChild(el); c.el = el; });
  updateLabels();
}
function updateLabels(){ CL.forEach(c => { const [n,w]=moduleCount(c.g.m[0]); c.el.querySelector("span").textContent = `${n} ${w}`.trim(); }); renderRail(); }

/* ============================================================
   CAMERA — orbit with inertia, "grab" rotation, zoom = distance
   ============================================================ */
const HOME = {pitch:.16, dist:3.0};
const cam = {yaw:.6, pitch:HOME.pitch, dist:HOME.dist, tYaw:null, tPitch:HOME.pitch, tDist:HOME.dist, vy:0, vp:0, ox:0, tOx:0};
let paused=false, focusId=null, drag=null, lastInteract=0;
const PITCH_MAX = 1.48;
function focalF(){ return 0.40*Math.min(W, H*1.25)*3.0; }
glc.addEventListener("pointerdown", e => { if (e.button > 0) return; drag={x:e.clientX,y:e.clientY,t:performance.now()}; cam.tYaw=null; cam.vy=cam.vp=0; glc.setPointerCapture(e.pointerId); lastInteract=performance.now(); hideHint(); });
glc.addEventListener("pointermove", e => {
  if(!drag) return;
  const now=performance.now(), dx=e.clientX-drag.x, dy=e.clientY-drag.y, dt=Math.max(1,now-drag.t);
  const ky = 0.0052/Math.max(.6,cam.dist/3), kp = 0.0042;

glc.addEventListener("pointerup", () => { if (drag && performance.now()-drag.t>80){ cam.vy=0; cam.vp=0; } drag=null; });
glc.addEventListener("wheel", e => { e.preventDefault(); cam.tDist = clamp(cam.tDist*Math.exp(e.deltaY*0.001), (VIS.style===2 && window.EARTH && EARTH.ready) ? .42 : .75, 6.5); lastInteract=performance.now(); hideHint(); }, {passive:false});
glc.addEventListener("dblclick", () => { resetView(); });
function resetView(){ cam.tPitch = HOME.pitch; cam.tDist = focusId?2.4:HOME.dist; cam.vy=cam.vp=0; }
let hintGone = store.get("hintGone", false);

let energy=0, mode="idle", pulse=0;
function setMode(m){ mode=m; $("#status").dataset.s=m;
  $("#statusTxt").textContent = {idle: S.config.has_key?"Online":"Základní režim", listening:"Poslouchám", thinking:"Přemýšlím", speaking:"Mluvím", offline:"Offline"}[m]||m; }

let booting = true;

  const labI = clamp((intro-.45)/.4,0,1);
  for (const c of CL){
    const x=c.x*spread, y=c.y*spread+.02, z=c.z*spread;
    const x1 = x*cY - z*sY, z1 = x*sY + z*cY, y2 = y*cP - z1*sP, z2 = y*sP + z1*cP;
    const ps = F/(D - z2), qx = cx + x1*ps, qy = cy - y2*ps;
    let o = clamp((z2+1.2)/1.6, .22, 1) * labI;
    if (fIdx>=0 || z2 > D-0.35 || !VIS.labels) o = 0;
    if (Math.hypot(qx-cx, qy-cy)/coreR < 1.1 && z2<0) o = 0;
    c.el.style.opacity = o.toFixed(3);
    c.el.style.pointerEvents = o>.2 ? "auto":"none";
    c.el.style.transform = `translate3d(${qx.toFixed(1)}px,${(qy-18).toFixed(1)}px,0) translate(-50%,-50%)`;
    c.el.style.zIndex = z2>0 ? 3 : 2;
  }
  $("#hudL").style.opacity = (focusId || !VIS.hud ? 0 : labI*.95).toFixed(2);
  const st = $("#status"); st.style.transform = `translate3d(${cx}px,${cy + Math.max(coreR*2.9, 40)}px,0) translate(-50%,0)`;
  st.style.opacity = (focusId? 0 : labI).toFixed(2);

  tickTimer(now);
  fpsN++; if (now-fpsT>1000){ FPS=Math.round(fpsN*1000/(now-fpsT)); $("#sub2").textContent = `${S.config.name||"—"} · ${FPS} fps`; fpsN=0; fpsT=now;
    if (document.visibilityState==="visible" && intro>=1){ lowN = FPS < Math.min(55, refreshHz()*0.8) ? lowN+1 : 0;
      if (lowN>=3 && glScale>.6){ glScale=Math.max(.6,glScale-.15); lowN=0; resize(); } } }
  requestAnimationFrame(loop);
}

function focusModule(id){
  const k = groupIdx(id); if (k<0) return;
  const same = focusId && groupIdx(focusId)===k;
  if (focusId!==id) sfx(same ? "tick" : "open"); focusId = id; GTAB[GROUPS[k].id] = id; document.body.classList.add("focused");
  const c = CL[k];
  let tgt = Math.atan2(c.x, c.z);
  let cur = cam.yaw; while (tgt-cur > Math.PI) tgt -= Math.PI*2; while (tgt-cur < -Math.PI) tgt += Math.PI*2;
  cam.vy=cam.vp=0;
  cam.tYaw = tgt - 0.5; cam.tDist = 2.35; cam.tPitch = clamp(Math.atan2(c.y, Math.hypot(c.x,c.z)*Math.cos(.5)), -.7, .7); cam.tOx = -Math.min(230, W*0.16);
  $("#backTxt").textContent = GROUPS[k].name;
  renderSide(id); renderRail();
}

const TM = Object.assign({mode:"timer", running:false, end:0, remain:300, total:300, swStart:0, swAcc:0, swRun:false, laps:[], phase:"work", pomos:0, remId:null}, store.get("timer", {}));
function saveTM(){ store.set("timer", TM); }
function timerRemain(){ return TM.running ? Math.max(0,(TM.end-Date.now())/1000) : TM.remain; }
function swTime(){ return (TM.swAcc + (TM.swRun ? Date.now()-TM.swStart : 0))/1000; }
async function timerStart(secs, label){
  if (secs!=null){ TM.total = TM.remain = secs; }
  TM.end = Date.now() + TM.remain*1000; TM.running = true;
  const txt = label || (TM.mode==="pomodoro" ? (TM.phase==="work" ? "🍅 Konec soustředění – dej si pauzu" : "🍅 Pauza skončila – zpátky do práce") : "⏱ Časovač doběhl");
  try { const r = await api("/api/reminder",{action:"add", text:txt, in_minutes: TM.remain/60}); const rr = await api("/api/state"); S=rr; const mine = S.reminders.filter(x=>!x.done && x.text===txt).sort((a,b)=>b.due-a.due)[0]; TM.remId = mine?mine.id:null; } catch {}
  saveTM(); renderSideIf("timer"); updateLabels();
}
async function timerPause(){
  if (!TM.running) return; TM.remain = timerRemain(); TM.running = false;
  if (TM.remId){ api("/api/reminder",{action:"delete", id:TM.remId}).catch(()=>{}); TM.remId=null; }
  saveTM(); renderSideIf("timer"); updateLabels();
}
function timerReset(){ timerPause(); TM.remain = TM.total = TM.mode==="pomodoro" ? (TM.phase==="work"?1500:300) : (TM.total||300); saveTM(); renderSideIf("timer"); }
let lastTick = 0;
function tickTimer(now){

    TM.running=false; TM.remId=null; TM.remain=0;
    if (TM.mode==="pomodoro"){ if (TM.phase==="work"){ TM.pomos++; TM.phase="break"; TM.remain=TM.total=(TM.pomos%4===0?900:300); } else { TM.phase="work"; TM.remain=TM.total=1500; } timerStart(); }

    const arc=$("#tmArc"); if (arc){ const f = isSw ? (v%60)/60 : (TM.total? v/TM.total : 0); arc.style.strokeDashoffset = (1-f)*628; }

function drawWxChart(){
  const cv = $("#wxc"); if (!cv || !WX) return; const r=cv.getBoundingClientRect(); if(!r.width) return;
  cv.width=r.width*DPR; cv.height=r.height*DPR; const g=cv.getContext("2d"); g.scale(DPR,DPR);
  const h=WX.hourly.slice(0,24), w=r.width, H2=r.height-28, mn=Math.min(...h.map(x=>x.temp))-1, mx=Math.max(...h.map(x=>x.temp))+1;
  const X=i=>8+i*(w-16)/(h.length-1), Y=t=>10+(1-(t-mn)/(mx-mn))*H2;
  h.forEach((x,i)=>{ if(x.pp){ g.fillStyle=`rgba(77,141,255,${.12+x.pp/250})`; const bh=x.pp/100*(H2-10); g.fillRect(X(i)-3, 10+H2-bh, 6, bh); } });
  const gr=g.createLinearGradient(0,0,0,H2+10); gr.addColorStop(0,"rgba(243,200,150,.35)"); gr.addColorStop(1,"rgba(243,200,150,0)");
  g.beginPath(); h.forEach((x,i)=>i?g.lineTo(X(i),Y(x.temp)):g.moveTo(X(i),Y(x.temp))); g.lineTo(X(h.length-1),H2+10); g.lineTo(X(0),H2+10); g.fillStyle=gr; g.fill();
  g.beginPath(); h.forEach((x,i)=>i?g.lineTo(X(i),Y(x.temp)):g.moveTo(X(i),Y(x.temp))); g.strokeStyle="#f3c896"; g.lineWidth=1.6; g.stroke();
  g.font="9.5px Segoe UI, sans-serif"; g.textAlign="center";
  h.forEach((x,i)=>{ if(i%3) return; g.fillStyle="rgba(255,255,255,.85)"; g.fillText(Math.round(x.temp)+"°",X(i),Y(x.temp)-6); g.fillStyle="rgba(255,255,255,.35)"; g.fillText(x.t,X(i),r.height-4); });
}
function drawSpark(cv, data, color, max=100){
  if (!cv) return; const r=cv.getBoundingClientRect(); if(!r.width) return;
  cv.width=r.width*DPR; cv.height=r.height*DPR; const g=cv.getContext("2d"); g.scale(DPR,DPR);
  const w=r.width, h=r.height; if (data.length<2) return;
  const pts = data.slice(-60).map((v,i,a)=>[i/(a.length-1)*w, h-2-(v/max)*(h-4)]);
  const gr=g.createLinearGradient(0,0,0,h); gr.addColorStop(0,color+"55"); gr.addColorStop(1,color+"00");
  g.beginPath(); g.moveTo(0,h); pts.forEach(p=>g.lineTo(p[0],p[1])); g.lineTo(w,h); g.fillStyle=gr; g.fill();
  g.beginPath(); pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])); g.strokeStyle=color; g.lineWidth=1.4; g.stroke();
}
function drawSparks(){ document.querySelectorAll("[data-spark]").forEach(cv => { const k=cv.dataset.spark; drawSpark(cv, SYSH[k], {cpu:"#a35cff",ram:"#4d8dff",gpu:"#36d97b",temp:"#ff8a3d"}[k]); }); }

function bars(cv, data, color, opts={}){
  const r=cv.getBoundingClientRect(); if(!r.width) return; cv.width=r.width*DPR; cv.height=r.height*DPR;
  const g=cv.getContext("2d"); g.scale(DPR,DPR); const w=r.width, h=r.height, pad=opts.axis?18:0, max=Math.max(1,...data);
  const n=data.length, bw=(w-pad)/n;
  if (opts.axis){ g.fillStyle="rgba(255,255,255,.3)"; g.font="9px Segoe UI, sans-serif"; g.fillText(max,0,8); g.fillText(Math.round(max/2),0,h/2-6); g.fillText(0,0,h-16);
    g.strokeStyle="rgba(255,255,255,.05)"; [0,.5].forEach(f=>{g.beginPath();g.moveTo(pad,f*(h-14)+4);g.lineTo(w,f*(h-14)+4);g.stroke();}); }
  data.forEach((v,i)=>{ const bh=Math.max(v?2:1,(v/max)*(h-(opts.axis?18:4))); const x=pad+i*bw+bw*.2;
    const last = i>=n-(opts.hot||1);

let findSel = 0, findItems = [];
function openFind(initial=""){
  $("#findDate").textContent = new Date().toLocaleDateString("cs-CZ",{day:"numeric",month:"short",year:"numeric"});

function hl(text, q){ let t=esc(text); if(!q) return t; const nt=norm(text); const idx=nt.indexOf(q); if(idx<0) return t;
  return esc(text.slice(0,idx))+"<mark>"+esc(text.slice(idx,idx+q.length))+"</mark>"+esc(text.slice(idx+q.length)); }
function doFind(){
  const q = norm($("#findQ").value.trim()); const toks = q.split(/\s+/).filter(Boolean);
  const pool = [];
  S.notes.forEach(n => pool.push({g:"Poznámka · "+fmtDay(n.ts), a:n.text.slice(0,90), b:n.text, go:()=>focusModule("notes"), ts:n.ts}));
  S.todos.forEach(t => pool.push({g:(t.done?"Úkol hotový · ":"Úkol · ")+fmtDay(t.ts), a:t.text, b:"", go:()=>focusModule("todo"), ts:t.ts}));
  (S.routines||[]).forEach(r => pool.push({g:"Rutina · Enter spustí", a:r.name, b:r.steps.map(x=>x.v).filter(Boolean).join(" · "), go:()=>{ closeModals(); api("/api/routine",{action:"run",id:r.id}).then(x=>toast(x.result)); }, ts:-1}));
  CLIP.forEach(c => pool.push({g:"Schránka · Enter zkopíruje", a:c.text.slice(0,90), b:c.text.length>90?c.text.slice(0,300):"", go:()=>{ api("/api/clip",{text:c.text}); toast("Zkopírováno"); }, ts:c.ts}));
  S.reminders.forEach(r => pool.push({g:"Připomínka · "+fmtDay(r.due)+" "+fmtTime(r.due), a:r.text, b:r.done?"proběhlo":rel(r.due), go:()=>focusModule("reminders"), ts:r.due}));
  S.apps.forEach(a => pool.push({g:"Aplikace · Enter spustí", a, b:"", go:()=>{ api("/api/launch",{name:a}); closeModals(); showReply(`${a} běží.`,[],""); }, ts:0}));
  for (let i=0;i<S.log.length;i++){ const l=S.log[i]; if (l.kind!=="user") continue; const rep=S.log.slice(i+1,i+4).find(x=>x.kind==="jarvis");
    pool.push({g:"Konverzace · "+fmtDay(l.ts)+" "+fmtTime(l.ts), a:l.text, b:rep?rep.text:"", go:()=>focusModule("chat"), ts:l.ts}); }
  (window.FIND_EXT||[]).forEach(f=>f(pool));
  COMMANDS.forEach(([c,d]) => pool.push({g:"Příkaz · Enter provede", a:c, b:d, go:()=>{ closeModals(); send(c); }, ts:-1}));
  findItems = (toks.length ? pool.filter(p => { const t=norm(p.a+" "+p.b+" "+p.g); return toks.every(k=>t.includes(k)); }) : pool.filter(p=>p.ts>0).sort((a,b)=>b.ts-a.ts)).slice(0,60);

  $("#findRes").innerHTML = findItems.length ? findItems.map((p,i)=>`<div class="res${i===0?" sel":""}" data-i="${i}"><div class="a">${hl(p.a,toks[0])}</div><div class="g">${esc(p.g)}</div>${p.b?`<div class="b">${hl(p.b,toks[0])}</div>`:""}</div>`).join("")
    : `<div class="empty">${q?"Nic nenalezeno.":"Začni psát…"}</div>`;
  $("#findRes").querySelectorAll(".res").forEach(el => el.onclick = () => { closeModals(); findItems[+el.dataset.i].go(); });
}

/* ============================================================
   SPEECH OUT — Edge's natural Czech voice (Antonín / Vlasta Online)
   ============================================================ */
let speakGen = 0, audioCtx = null;
function ensureAudio(){}   // (kept for compatibility)
function chunkText(text){
  const parts = text.replace(/https?:\/\/\S+/g,"").match(/[^.!?…]+[.!?…]*\s*/g) || [text];
  const out = []; let cur = "";
  for (const p of parts){ if ((cur+p).length > 260 && cur){ out.push(cur.trim()); cur = p; } else cur += p; }
  if (cur.trim()) out.push(cur.trim());
  return out;
}
function stopSpeaking(){ speakGen++; if (typeof curAudio!=="undefined" && curAudio){ try{ curAudio.pause(); }catch{} curAudio=null; } if ("speechSynthesis" in window) speechSynthesis.cancel(); if (mode==="speaking") setMode("idle"); }
let curAudio = null, audioCtx2 = null, analyser2 = null, lvlBuf = null;
function ensureAnalyser(){ if (audioCtx2) return; try { audioCtx2 = new (window.AudioContext||window.webkitAudioContext)(); analyser2 = audioCtx2.createAnalyser(); analyser2.fftSize = 512; lvlBuf = new Uint8Array(512); analyser2.connect(audioCtx2.destination); } catch { audioCtx2 = null; } }
setInterval(() => { if (!analyser2 || !curAudio || mode!=="speaking") return; analyser2.getByteTimeDomainData(lvlBuf); let s=0; for (let i=0;i<lvlBuf.length;i+=4){ const v=(lvlBuf[i]-128)/128; s+=v*v; } pulse = Math.max(pulse, Math.min(1, Math.sqrt(s/(lvlBuf.length/4))*4)); }, 40);
async function speakEleven(text, gen){
  const r = await fetch(`/api/tts?text=${encodeURIComponent(text)}`);
  if (!r.ok) throw new Error("tts " + r.status);
  const blob = await r.blob(); if (gen!==speakGen) return true;
  const url = URL.createObjectURL(blob); const a = new Audio(url); curAudio = a;
  ensureAnalyser(); if (audioCtx2 && audioCtx2.state==="suspended") await audioCtx2.resume().catch(()=>{});
  if (audioCtx2 && audioCtx2.state==="running"){ try { audioCtx2.createMediaElementSource(a).connect(analyser2); } catch {} }
  setMode("speaking"); pulse = 1;
  await new Promise((res, rej) => { a.onended = res; a.onerror = rej; a.play().catch(e => { if (e && e.name==="NotAllowedError"){ pendingSpeech = text; } rej(e); }); });
  URL.revokeObjectURL(url); curAudio = null;
  if (gen===speakGen){ setMode("idle"); resumeWake(); }
  return true;
}
function speak(text, force, opts={}){
  if ((!S.config.voice && !force) || !text) return;
  if (opts.source==="claude" && !S.config.ai_voice) return;
  stopSpeaking(); stopListen(true); pauseWake();
  const gen = ++speakGen;
  if (S.config.tts_provider==="eleven" && S.config.has_eleven){
    speakEleven(text, gen).catch(() => { if (gen===speakGen && !pendingSpeech) speakEdge(text, gen); });
    return;
  }
  speakEdge(text, gen);
}
function speakEdge(text, gen){
  if (!("speechSynthesis" in window)){ api("/api/say",{text}); return; }
  const v = pickVoice(); const parts = chunkText(text); let left = parts.length, failed = false;
  parts.forEach(p => {
    const u = new SpeechSynthesisUtterance(p); u.lang = "cs-CZ"; if (v) u.voice = v;
    u.rate = +(S.config.voice_rate||1); u.pitch = 1; u.volume = 1;
    u.onstart = () => { if (gen===speakGen){ setMode("speaking"); pulse = 1; } };
    u.onboundary = e => { if (e.name!=="sentence") pulse = .65 + Math.random()*.55; };
    u.onerror = e => { if (!failed && e.error==="not-allowed"){ failed = true; speechSynthesis.cancel(); pendingSpeech = text; } };
    u.onend = () => { if (--left<=0 && gen===speakGen){ setMode("idle"); resumeWake(); } };
    speechSynthesis.speak(u);
  });
}
// if the browser blocks speech before the first click, say it right after the first interaction
let pendingSpeech = null;
["pointerdown","keydown"].forEach(ev => addEventListener(ev, () => { if (pendingSpeech){ const t=pendingSpeech; pendingSpeech=null; setTimeout(()=>speak(t,true), 50); } }, true));

   SFX — tiny synthesized HUD sounds (no files)
   ============================================================ */
let sfxCtx = null;
function sfxOn(){ return S.config.ui_sounds !== false; }
function sfxEnsure(){ if (!sfxCtx){ try { sfxCtx = new (window.AudioContext||window.webkitAudioContext)(); } catch { return null; } } if (sfxCtx.state==="suspended") sfxCtx.resume().catch(()=>{}); return sfxCtx; }
["pointerdown","keydown"].forEach(ev => addEventListener(ev, () => { if (sfxOn()) sfxEnsure(); }, {once:true, capture:true}));
function tone(f, t0, dur, vol, type="sine", f2=null){
  const c = sfxCtx; const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, c.currentTime+t0); if (f2) o.frequency.exponentialRampToValueAtTime(f2, c.currentTime+t0+dur);
  g.gain.setValueAtTime(0, c.currentTime+t0); g.gain.linearRampToValueAtTime(vol, c.currentTime+t0+.008); g.gain.exponentialRampToValueAtTime(.0001, c.currentTime+t0+dur);
  o.connect(g).connect(c.destination); o.start(c.currentTime+t0); o.stop(c.currentTime+t0+dur+.02);
}
function sfx(kind){
  if (!sfxOn()) return; const c = sfxEnsure(); if (!c || c.state!=="running") return;
  try {
    if (kind==="tick")   tone(1800, 0, .035, .025, "square");
    if (kind==="send")   { tone(880, 0, .07, .05); tone(1320, .05, .09, .04); }
    if (kind==="reply")  { tone(660, 0, .12, .035); tone(990, .07, .16, .03); }
    if (kind==="open")   tone(420, 0, .16, .04, "sine", 820);
    if (kind==="close")  tone(760, 0, .14, .035, "sine", 380);
    if (kind==="notify") { tone(1046, 0, .12, .05); tone(1568, .1, .2, .045); }
    if (kind==="alert")  { [0,.18,.36].forEach(t=>tone(1318, t, .12, .06, "triangle")); }
    if (kind==="boot")   { tone(110, 0, 1.2, .06, "sine", 220); tone(220, .3, 1.0, .03, "triangle", 440); }
    if (kind==="ready")  { tone(523, 0, .18, .05); tone(784, .12, .22, .05); tone(1046, .24, .4, .05); }
  } catch {}
}

   SPEECH IN
   ============================================================ */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false, wakeRec = null, wakeOn = false;
function startListen(){
  if (!SR){ toast("Rozpoznávání řeči tady není dostupné"); return; }
  if (listening){ stopListen(); return; }
  stopSpeaking(); pauseWake();
  rec = new SR(); rec.lang = "cs-CZ"; rec.interimResults = true; rec.continuous = false;
  let finalTxt = "";
  rec.onresult = e => { let t=""; for (const r of e.results){ t += r[0].transcript; if (r.isFinal) finalTxt = t; } $("#q").value = t; };
  rec.onerror = e => { if (e.error!=="no-speech" && e.error!=="aborted") toast("Mikrofon: "+e.error); };
  rec.onend = () => { listening=false; $("#mic").classList.remove("on"); if (mode==="listening") setMode("idle");
    const t = (finalTxt || $("#q").value).trim(); if (t) send(t); else resumeWake(); };
  rec.start(); listening = true; $("#mic").classList.add("on"); setMode("listening");
}
function stopListen(silent){ if (rec && listening){ try{ silent ? rec.abort() : rec.stop(); }catch{} } }
function setupWake(){
  wakeOn = !!(S.config.wake_word && SR);
  if (!wakeOn){ pauseWake(); return; }
  resumeWake();
}
function pauseWake(){ if (wakeRec){ wakeRec.onend=null; try{wakeRec.abort();}catch{} wakeRec=null; } }
function resumeWake(){
  if (!wakeOn || wakeRec || listening || mode==="speaking") return;
  wakeRec = new SR(); wakeRec.lang="cs-CZ"; wakeRec.continuous=true; wakeRec.interimResults=false;
  wakeRec.onresult = e => {
    const t = e.results[e.results.length-1][0].transcript.trim(); const n = norm(t);
    const m = n.match(/(?:^|\s)(?:hej |ok )?(jarvis\w*|dzarvis\w*|jarvi\w*)[ ,]*(.*)$/);
    if (!m) return;
    const rest = t.split(/\s+/).slice(n.slice(0, n.indexOf(m[1])).split(/\s+/).filter(Boolean).length + 1).join(" ").trim();
    pauseWake();
    if (rest.length > 2) send(rest); else { speak("Ano?", true); setTimeout(startListen, 900); }
  };
  wakeRec.onend = () => { wakeRec = null; setTimeout(resumeWake, 300); };
  wakeRec.onerror = () => {};
  try { wakeRec.start(); } catch { wakeRec = null; }
}

let sayT, busy=false;
function showReply(text, actions, you){
  clearTimeout(sayT);
  $("#acts").innerHTML = (actions||[]).filter(a=>a.result||a.tool).slice(0,4).map(a=>`<span class="act">⚙ ${esc(a.tool==="web_search"?"hledání na webu":(a.result||a.tool).slice(0,60))}</span>`).join("");

  const el = $("#say"); el.style.opacity = 1; el.textContent = "";
  let i=0; const step = () => { i += Math.max(1, Math.round(text.length/90)); el.textContent = text.slice(0,i); if (i<text.length) requestAnimationFrame(step); };
  step();
  sayT = setTimeout(() => { el.style.opacity=0; $("#you").style.opacity=0; $("#acts").innerHTML=""; }, 9000 + text.length*55);
}
async function send(text){
  text = (text||$("#q").value).trim(); if (!text || busy) return;
  $("#q").value = ""; busy = true; sfx("send"); setMode("thinking"); stopSpeaking(); setMode("thinking");
  $("#you").textContent = `„${text}“`; $("#you").style.opacity=1; $("#say").textContent=""; $("#acts").innerHTML="";
  try {
    const r = await api("/api/chat", {text});
    showReply(r.reply, r.actions, text); sfx("reply");

    if (r.ui?.timer) startTimerMode(r.ui.timer);

function welcomeHome(mins){

const BOX_DAYS = [0, 1, 2, 4, 8, 16, 32];

function flDue(dk){ const n=Date.now()/1000; return dk.cards.filter(c=>(c.due||0)<=n); }

function parseCards(txt){
  return txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l => {
    const p = l.split(/\s*(?:\t|;| - | – | = |:)\s*/); if (p.length<2) return null;
    return {id:uid(), q:p[0], a:p.slice(1).join(" – "), box:0, due:0};
  }).filter(Boolean);
}
function flSpeak(text, lang){
  try { const u = new SpeechSynthesisUtterance(text); u.lang = lang||"de-DE";
    const v = speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith((lang||"de").slice(0,2).toLowerCase()));
    u.voice = v.find(x=>/Natural|Online/.test(x.name)) || v[0] || null; u.rate = .95; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch {}
}
function flStart(deckId, all){
  const dk = flData().decks.find(d=>d.id===deckId); if (!dk || !dk.cards.length) return;
  let q = all ? [...dk.cards] : flDue(dk); if (!q.length) q = [...dk.cards];

}
function flNext(){ FL.cur = FL.queue.shift() || null; FL.flip = false; if (!FL.cur) FL.mode = "done"; renderSide("flash"); }
function flGrade(g){
  const dk = flData().decks.find(d=>d.id===FL.deck); const c = dk && dk.cards.find(x=>x.id===FL.cur); if (!c) return flNext();
  const now = Date.now()/1000;
  if (g===1){ c.box = 0; c.due = now; FL.bad++; FL.queue.splice(Math.min(3, FL.queue.length), 0, c.id); sfx&&sfx("tick"); }
  else if (g===2){ c.box = Math.max(1, c.box||0); c.due = now + BOX_DAYS[c.box]*86400*.6; FL.ok++; }
  else { c.box = Math.min((c.box||0)+1, BOX_DAYS.length-1); c.due = now + BOX_DAYS[c.box]*86400; FL.ok++; sfx&&sfx("ready"); }
  flSave(); flNext();
}

const FO = Object.assign({running:false, paused:false, end:0, remain:1500, total:1500, task:"", sound:"rain", vol:.45, min:25}, store.get("focus", {}));
