/* ---- ambient engine ---- */
const AMB = {ctx:null, out:null, nodes:[], kind:null, drops:null};
function ambNoise(ctx, kind){
  const len = ctx.sampleRate*4, buf = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let ch=0; ch<2; ch++){ const d = buf.getChannelData(ch); let last=0, b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
    for (let i=0;i<len;i++){ const w = Math.random()*2-1;
      if (kind==="brown"){ last = (last + .02*w)/1.02; d[i] = last*3.2; }
      else { b0=.99886*b0+w*.0555179; b1=.99332*b1+w*.0750759; b2=.969*b2+w*.153852; b3=.8665*b3+w*.3104856; b4=.55*b4+w*.5329522; b5=-.7616*b5-w*.016898; d[i]=(b0+b1+b2+b3+b4+b5+b6+w*.5362)*.11; b6=w*.115926; } } }
  const s = ctx.createBufferSource(); s.buffer = buf; s.loop = true; return s;
}
function ambStop(){ AMB.nodes.forEach(n => { try { n.stop ? n.stop() : 0; } catch {} try { n.disconnect(); } catch {} }); AMB.nodes = []; clearInterval(AMB.drops); AMB.kind = null; }
function ambPlay(kind){
  ambStop(); if (!kind || kind==="none") return;
  const ctx = AMB.ctx = AMB.ctx || new (window.AudioContext||window.webkitAudioContext)(); if (ctx.state==="suspended") ctx.resume();
  const out = AMB.out = ctx.createGain(); out.gain.value = 0; out.connect(ctx.destination);
  out.gain.linearRampToValueAtTime(FO.vol, ctx.currentTime + 2.5);
  const keep = (...n) => AMB.nodes.push(...n);
  if (kind==="rain"){
    const n = ambNoise(ctx,"pink"), hp = ctx.createBiquadFilter(), lp = ctx.createBiquadFilter(), g = ctx.createGain();
    hp.type="highpass"; hp.frequency.value=400; lp.type="lowpass"; lp.frequency.value=7000; g.gain.value=.55;
    n.connect(hp).connect(lp).connect(g).connect(out); n.start(); keep(n,hp,lp,g,out);
    const rumble = ambNoise(ctx,"brown"), rl = ctx.createBiquadFilter(), rg = ctx.createGain(); rl.type="lowpass"; rl.frequency.value=180; rg.gain.value=.35;
    rumble.connect(rl).connect(rg).connect(out); rumble.start(); keep(rumble,rl,rg);
    AMB.drops = setInterval(() => { if (Math.random()<.55){ const o=ctx.createOscillator(), dg=ctx.createGain(), t=ctx.currentTime, f=1800+Math.random()*2600;
      o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(f*.45,t+.05); dg.gain.setValueAtTime(.012+Math.random()*.02,t); dg.gain.exponentialRampToValueAtTime(.0001,t+.06);
      o.connect(dg).connect(out); o.start(t); o.stop(t+.07); } }, 70);
  } else if (kind==="brown"){
    const n = ambNoise(ctx,"brown"), lp = ctx.createBiquadFilter(), g = ctx.createGain(); lp.type="lowpass"; lp.frequency.value=900; g.gain.value=.9;
    n.connect(lp).connect(g).connect(out); n.start(); keep(n,lp,g,out);
  } else if (kind==="ship"){
    const n = ambNoise(ctx,"brown"), lp = ctx.createBiquadFilter(), g = ctx.createGain(); lp.type="lowpass"; lp.frequency.value=320; g.gain.value=.6;
    n.connect(lp).connect(g).connect(out); n.start(); keep(n,lp,g,out);
    [[55,.09],[55.4,.07],[82.5,.045],[110.2,.025]].forEach(([f,v]) => { const o=ctx.createOscillator(), og=ctx.createGain(); o.type="sine"; o.frequency.value=f; og.gain.value=v; o.connect(og).connect(out); o.start(); keep(o,og); });
    const lfo = ctx.createOscillator(), lg = ctx.createGain(); lfo.frequency.value=.07; lg.gain.value=140; lfo.connect(lg).connect(lp.frequency); lfo.start(); keep(lfo,lg);
  } else if (kind==="fire"){
    const n = ambNoise(ctx,"brown"), bp = ctx.createBiquadFilter(), g = ctx.createGain(); bp.type="lowpass"; bp.frequency.value=500; g.gain.value=.75;
    n.connect(bp).connect(g).connect(out); n.start(); keep(n,bp,g,out);
    AMB.drops = setInterval(() => { const k = Math.random()<.25 ? 3 : 1; for (let i=0;i<k;i++){ const t=ctx.currentTime+i*.03+Math.random()*.05, b=ctx.createBufferSource(), cb=ctx.createBuffer(1, 600, ctx.sampleRate), d=cb.getChannelData(0);
      for (let j=0;j<600;j++) d[j]=(Math.random()*2-1)*Math.pow(1-j/600,6); b.buffer=cb; const cg=ctx.createGain(); cg.gain.value=.08+Math.random()*.18; const hf=ctx.createBiquadFilter(); hf.type="highpass"; hf.frequency.value=1200+Math.random()*2500;
      b.connect(hf).connect(cg).connect(out); b.start(t); } }, 140);
  }
  AMB.kind = kind;
}

function trData(){ return KV("train", {react:null, aim:null, hist:[]}); }
const RX = {state:"idle", t0:0, timer:null, times:[], rounds:5};
function reactRank(ms){ return ms<180 ? ["PRO HRÁČ","var(--green)"] : ms<220 ? ["VÝBORNÉ","#9be37a"] : ms<260 ? ["NADPRŮMĚR","var(--warm)"] : ms<320 ? ["PRŮMĚR","var(--orange)"] : ["ROZCVIČ SE","var(--red)"]; }
function renderTrain(B){
  const d = trData(); const avg = RX.times.length ? Math.round(RX.times.reduce((a,b)=>a+b,0)/RX.times.length) : null;
  const msg = {idle:["Test reakce", "Klikni pro start · 5 kol"], wait:["Počkej na zelenou…", "neklikej dřív"], go:["TEĎ!", ""], early:["Moc brzo 😅", "klikni a zkus znovu"],
    hit:[RX.times.length?RX.times[RX.times.length-1]+" ms":"", `kolo ${RX.times.length}/${RX.rounds} · klikni dál`], done:[avg+" ms", "průměr · klikni pro novou hru"]}[RX.state];
  const [rk, rc] = avg ? reactRank(avg) : ["",""];
  B.innerHTML = `<div class="rx ${RX.state}" id="rxBox"><div class="t">${msg[0]}</div><div class="s">${msg[1]}</div>${RX.state==="done"?`<div class="rk" style="color:${rc}">${rk}</div>`:""}</div>
    <div class="rx-dots">${[...Array(RX.rounds)].map((_,i)=>`<i class="${i<RX.times.length?"y":""}">${RX.times[i]?RX.times[i]:""}</i>`).join("")}</div>
    <div class="tr-best"><div><small>NEJLEPŠÍ REAKCE</small><b>${d.react?d.react+" ms":"—"}</b></div><div><small>NEJLEPŠÍ AIM</small><b>${d.aim?d.aim.score:"—"}</b>${d.aim?`<em>${d.aim.acc} % přesnost</em>`:""}</div></div>
    <button class="fo-go" id="aimGo" style="margin:12px 6px 0;width:calc(100% - 12px)">🎯 Aim trainer · 30 s</button>
    <div class="m" style="font-size:10.5px;color:var(--faint);margin:10px 12px">Rozcvička před hraním. Trefuj terče co nejrychleji — čím menší a rychlejší, tím víc bodů. Combo násobí skóre.</div>`;
  $("#rxBox").onpointerdown = e => { e.preventDefault(); reactClick(); };
  $("#aimGo").onclick = () => aimStart();
}
function reactClick(){
  clearTimeout(RX.timer);
  if (RX.state==="wait"){ RX.state = "early"; sfx("alert"); return renderSide("train"); }
  if (RX.state==="go"){ const ms = Math.round(performance.now()-RX.t0); RX.times.push(ms); sfx("tick");
    if (RX.times.length>=RX.rounds){ RX.state="done"; const avg = Math.round(RX.times.reduce((a,b)=>a+b,0)/RX.times.length); const d=trData();
      if (!d.react || avg<d.react){ d.react = avg; toast(`🏆 Nový rekord reakce: ${avg} ms`); sfx("ready"); } kvSave("train", d); }
    else RX.state = "hit";
    return renderSide("train"); }
  if (RX.state==="idle" || RX.state==="done") RX.times = [];
  RX.state = "wait"; renderSide("train");
  RX.timer = setTimeout(() => { RX.state = "go"; renderSide("train"); RX.t0 = performance.now(); }, 1200 + Math.random()*2600);
}

/* ---- Aim trainer overlay ---- */
const AIM = {on:false};
function aimStart(){
  let o = $("#aimOv"); if (!o){ o = document.createElement("div"); o.id="aimOv"; document.body.appendChild(o); }
  Object.assign(AIM, {on:true, score:0, hits:0, shots:0, combo:0, best:0, end:performance.now()+30000, targets:[], rt:[], last:performance.now()});
  o.innerHTML = `<div class="aim-hud"><span>SKÓRE <b id="aimS">0</b></span><span>ČAS <b id="aimT">30.0</b></span><span>COMBO <b id="aimC">×1</b></span><span>PŘESNOST <b id="aimA">—</b></span></div><div class="aim-field" id="aimF"></div><div class="aim-esc">Esc ukončí</div>`;
  o.classList.add("on"); document.body.classList.add("focus-on");
  const F = $("#aimF");
  F.onpointerdown = e => { if (e.target.closest(".tg")) return; AIM.shots++; AIM.combo = 0; sfx("close"); const m=document.createElement("i"); m.className="miss"; m.style.left=e.clientX+"px"; m.style.top=e.clientY+"px"; F.appendChild(m); setTimeout(()=>m.remove(),500); aimHud(); };
  for (let i=0;i<3;i++) aimSpawn();
  sfx("open"); requestAnimationFrame(aimTick);
}
function aimSpawn(){
  if (!AIM.on) return; const F = $("#aimF"), W = innerWidth, H = innerHeight;
  const elapsed = 1 - Math.max(0,(AIM.end-performance.now())/30000), size = 74 - elapsed*30, life = 2300 - elapsed*900;
  const t = document.createElement("button"); t.className = "tg"; const x = 80+Math.random()*(W-160), y = 110+Math.random()*(H-220);
  t.style.cssText = `left:${x}px;top:${y}px;width:${size}px;height:${size}px;--life:${life}ms`; t.dataset.born = performance.now();
  t.onpointerdown = e => { e.stopPropagation(); const dt = performance.now()-(+t.dataset.born); AIM.shots++; AIM.hits++; AIM.combo++; AIM.best=Math.max(AIM.best,AIM.combo); AIM.rt.push(dt);
    const pts = Math.round((100 + Math.max(0, life-dt)/life*100) * (1+Math.min(AIM.combo,10)*.1) * (74/size)); AIM.score += pts; sfx("tick"); pulse = 1;
    const p = document.createElement("i"); p.className="pop"; p.textContent = "+"+pts; p.style.left=x+"px"; p.style.top=y+"px"; F.appendChild(p); setTimeout(()=>p.remove(),700);
    t.remove(); aimSpawn(); aimHud(); };
  F.appendChild(t); setTimeout(() => { if (t.isConnected){ t.remove(); AIM.combo = 0; aimSpawn(); aimHud(); } }, life);
}
function aimHud(){ $("#aimS").textContent = AIM.score; $("#aimC").textContent = "×"+(1+Math.min(AIM.combo,10)*.1).toFixed(1); $("#aimA").textContent = AIM.shots ? Math.round(AIM.hits/AIM.shots*100)+" %" : "—"; }
function aimTick(){ if (!AIM.on) return; const left = Math.max(0, AIM.end-performance.now()); $("#aimT").textContent = (left/1000).toFixed(1); if (left<=0) return aimEnd(true); requestAnimationFrame(aimTick); }
function aimEnd(done){
  AIM.on = false; const o = $("#aimOv"); const acc = AIM.shots ? Math.round(AIM.hits/AIM.shots*100) : 0, avg = AIM.rt.length ? Math.round(AIM.rt.reduce((a,b)=>a+b,0)/AIM.rt.length) : 0;
  if (!done){ o.classList.remove("on"); document.body.classList.remove("focus-on"); return; }
  const d = trData(), rec = !d.aim || AIM.score > d.aim.score; if (rec) d.aim = {score:AIM.score, acc}; d.hist = [...(d.hist||[]), {ts:Date.now()/1000, s:AIM.score}].slice(-50); kvSave("train", d);
  $("#aimF").innerHTML = `<div class="aim-res"><div class="k">${rec?"🏆 NOVÝ REKORD":"VÝSLEDEK"}</div><div class="big">${AIM.score}</div>
    <div class="row"><div><b>${AIM.hits}</b><small>zásahů</small></div><div><b>${acc} %</b><small>přesnost</small></div><div><b>${avg} ms</b><small>průměr na terč</small></div><div><b>×${AIM.best}</b><small>max combo</small></div></div>
    <div class="fo-ctrl"><button id="aimAgain">Znovu</button><button id="aimClose">Zavřít</button></div></div>`;
  sfx("ready"); $("#aimAgain").onclick = aimStart; $("#aimClose").onclick = () => { o.classList.remove("on"); document.body.classList.remove("focus-on"); renderSideIf("train"); };
  if (rec) speak(`Nový rekord. ${AIM.score} bodů, přesnost ${acc} procent.`, true);
}
addEventListener("keydown", e => { if (e.key==="Escape" && $("#aimOv")?.classList.contains("on")){ e.stopImmediatePropagation(); aimEnd(false); } }, true);

const CALC = {expr:"", hist: store.get("calc",[]), deg:true};
function calcEval(src){
  let s = String(src).toLowerCase().replace(/,/g,".").replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-").replace(/\s+/g,"");
  if (!s) return null;
  if (!/^[0-9+\-*/().^%!a-zπ√]*$/.test(s)) throw 0;
  const words = s.match(/[a-z]+/g) || []; const ok = ["sqrt","sin","cos","tan","asin","acos","atan","log","ln","pi","e","abs","round","floor","ceil","ans"];
  if (words.some(w=>!ok.includes(w))) throw 0;
  const D = CALC.deg ? Math.PI/180 : 1;
  s = s.replace(/π/g,"pi").replace(/√/g,"sqrt").replace(/(\d+(?:\.\d+)?)!/g,"fact($1)").replace(/(\d+(?:\.\d+)?)%/g,"($1/100)").replace(/\^/g,"**")
       .replace(/(\d)(pi|e\b|sqrt|sin|cos|tan|log|ln|\()/g,"$1*$2").replace(/\)(\d|\()/g,")*$1");
  const fn = new Function("pi","e","sqrt","sin","cos","tan","asin","acos","atan","log","ln","abs","round","floor","ceil","fact","ans",`return (${s});`);
  const fact = n => { n=Math.round(n); if (n<0||n>170) return NaN; let r=1; for(let i=2;i<=n;i++) r*=i; return r; };
  const v = fn(Math.PI, Math.E, Math.sqrt, x=>Math.sin(x*D), x=>Math.cos(x*D), x=>Math.tan(x*D), x=>Math.asin(x)/D, x=>Math.acos(x)/D, x=>Math.atan(x)/D, Math.log10, Math.log, Math.abs, Math.round, Math.floor, Math.ceil, fact, CALC.hist[0]?.v ?? 0);
  if (typeof v!=="number" || !isFinite(v)) throw 0; return v;
}

        const go2 = async () => {
          $("#obGo").disabled = true;
          const vis = Object.assign({...VIS_DEFAULT}, {style: st.style}, st.style===2 ? {rings:0, fog:.7, flare:.2} : {});
          try { const r = await api("/api/onboard", {name: st.name, vocative: v, city: st.city, visual: vis, core_color: st.theme, ui_sounds: st.sounds, voice: st.voice});
            S.config = r.config; } catch { S.config.name = st.name; S.config.vocative = v; }
          VIS = Object.assign({...VIS_DEFAULT}, S.config.visual || vis); applyTheme(); applyVis();
          sfx("ready"); o.classList.add("bye"); setTimeout(() => { o.remove(); done(); }, 650);
        };
        $("#obGo").onclick = go2; $("#obGo").focus();
        o.onkeydown = e => { if (e.key==="Enter" && !$("#obGo").disabled) go2(); };
      }
    }
    render();
  });
}
window.runOnboarding = runOnboarding;

</script>
