name: Build apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller + Inno Setup
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller==6.11.1
          choco install innosetup -y --no-progress
      - name: Build J.A.R.V.I.S. (pro kamarady)
        run: pyinstaller --noconfirm --clean --windowed --name JARVIS --icon assets/jarvis.ico --version-file packaging/version_home.txt --add-data "home/ui;ui" --distpath dist_home --workpath build_home home/jarvis.py
      - name: Installers
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\home.iss
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-instalacky
          path: output/*.exe
      - name: Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: J.A.R.V.I.S. 1.0.${{ github.run_number }}
          make_latest: true
          files: output/JARVIS-Setup.exe

  pages:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
